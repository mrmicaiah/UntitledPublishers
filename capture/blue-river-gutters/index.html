<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>Blue River Gutters - Photo Capture</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
    
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    :root {
      --bg: #1a1a2e;
      --bg-card: #16213e;
      --accent: #e94560;
      --accent-glow: rgba(233, 69, 96, 0.3);
      --text: #eaeaea;
      --text-dim: #8b8b9e;
      --success: #4ade80;
      --border: rgba(255,255,255,0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
    
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    #app-screen {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }
    
    .app-header {
      padding: 0.75rem 1rem;
      padding-top: calc(0.75rem + var(--safe-top));
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }
    
    .client-name { font-weight: 700; font-size: 1rem; }
    
    .upload-count {
      background: var(--accent);
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    
    .capture-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      gap: 1.25rem;
      width: 100%;
    }
    
    .capture-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, #c73e54 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 40px var(--accent-glow), inset 0 2px 0 rgba(255,255,255,0.2);
      transition: all 0.2s;
      position: relative;
      flex-shrink: 0;
    }
    
    .capture-btn::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      opacity: 0.3;
    }
    
    .capture-btn:active { transform: scale(0.95); }
    .capture-btn svg { width: 44px; height: 44px; fill: white; }
    .capture-hint { color: var(--text-dim); font-size: 0.85rem; }
    
    .gallery-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 1.25rem;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .gallery-btn svg { width: 18px; height: 18px; fill: var(--text-dim); }
    
    .upload-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }
    
    .upload-overlay.active { display: flex; }
    
    .upload-modal {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 1.5rem;
      text-align: center;
      width: calc(100% - 2rem);
      max-width: 280px;
      border: 1px solid var(--border);
    }
    
    .upload-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .upload-status { font-weight: 500; margin-bottom: 0.5rem; }
    .upload-detail { color: var(--text-dim); font-size: 0.8rem; }
    
    .upload-modal.success .upload-spinner { display: none; }
    
    .upload-modal.success::before {
      content: '\2713';
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      background: var(--success);
      border-radius: 50%;
      font-size: 1.5rem;
      color: white;
      margin: 0 auto 1rem;
    }
    
    .recent-section {
      padding: 1rem;
      padding-bottom: calc(1rem + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      width: 100%;
    }
    
    .recent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    
    .recent-title { font-weight: 600; font-size: 0.9rem; }
    
    .recent-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    
    .recent-thumb {
      aspect-ratio: 1;
      border-radius: 6px;
      object-fit: cover;
      background: var(--bg);
      border: 1px solid var(--border);
      width: 100%;
    }
    
    .recent-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.8rem;
      padding: 0.75rem;
    }
    
    #camera-input, #gallery-input { display: none; }
  </style>
</head>
<body>
  <div id="app-screen">
    <header class="app-header">
      <span class="client-name">Blue River Gutters</span>
      <span class="upload-count" id="upload-count">0 photos</span>
    </header>
    
    <div class="capture-area">
      <button class="capture-btn" id="capture-btn">
        <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </button>
      <p class="capture-hint">Tap to take a photo</p>
      <button class="gallery-btn" id="gallery-btn">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        Choose from gallery
      </button>
    </div>
    
    <div class="recent-section">
      <div class="recent-header">
        <span class="recent-title">Recent Uploads</span>
      </div>
      <div class="recent-grid" id="recent-grid">
        <p class="recent-empty">No uploads yet</p>
      </div>
    </div>
  </div>

  <div class="upload-overlay" id="upload-overlay">
    <div class="upload-modal" id="upload-modal">
      <div class="upload-spinner"></div>
      <p class="upload-status" id="upload-status">Uploading...</p>
      <p class="upload-detail" id="upload-detail">Please wait</p>
    </div>
  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment">
  <input type="file" id="gallery-input" accept="image/*" multiple>

  <script>
    const API_BASE = 'https://productivity-mcp-server.micaiah-tasks.workers.dev/api/capture';
    const PORTAL_ID = '781247fe-9939-422e-adf0-8cc898f4b7c6';
    
    const uploadCount = document.getElementById('upload-count');
    const captureBtn = document.getElementById('capture-btn');
    const galleryBtn = document.getElementById('gallery-btn');
    const cameraInput = document.getElementById('camera-input');
    const galleryInput = document.getElementById('gallery-input');
    const uploadOverlay = document.getElementById('upload-overlay');
    const uploadModal = document.getElementById('upload-modal');
    const uploadStatus = document.getElementById('upload-status');
    const uploadDetail = document.getElementById('upload-detail');
    const recentGrid = document.getElementById('recent-grid');
    
    captureBtn.addEventListener('click', () => cameraInput.click());
    galleryBtn.addEventListener('click', () => galleryInput.click());
    
    cameraInput.addEventListener('change', handleFiles);
    galleryInput.addEventListener('change', handleFiles);
    
    async function handleFiles(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      
      for (const file of files) {
        await uploadFile(file);
      }
      
      cameraInput.value = '';
      galleryInput.value = '';
      loadRecentUploads();
    }
    
    async function uploadFile(file) {
      showUploadOverlay('Uploading...', file.name);
      
      try {
        const formData = new FormData();
        formData.append('portal_id', PORTAL_ID);
        formData.append('image', file);
        
        const resp = await fetch(`${API_BASE}/upload`, {
          method: 'POST',
          body: formData
        });
        
        const data = await resp.json();
        
        if (!resp.ok || !data.success) {
          throw new Error(data.error || 'Upload failed');
        }
        
        showUploadSuccess();
        
      } catch (err) {
        alert('Upload failed: ' + err.message);
        hideUploadOverlay();
      }
    }
    
    function showUploadOverlay(status, detail) {
      uploadModal.classList.remove('success');
      uploadStatus.textContent = status;
      uploadDetail.textContent = detail;
      uploadOverlay.classList.add('active');
    }
    
    function showUploadSuccess() {
      uploadModal.classList.add('success');
      uploadStatus.textContent = 'Uploaded!';
      uploadDetail.textContent = 'Photo saved successfully';
      setTimeout(hideUploadOverlay, 1500);
    }
    
    function hideUploadOverlay() {
      uploadOverlay.classList.remove('active');
    }
    
    async function loadRecentUploads() {
      try {
        const resp = await fetch(`${API_BASE}/recent?portal_id=${PORTAL_ID}`);
        const data = await resp.json();
        const uploads = data.uploads || [];
        
        const statsResp = await fetch(`${API_BASE}/stats?portal_id=${PORTAL_ID}`);
        const stats = await statsResp.json();
        uploadCount.textContent = `${stats.total_uploads || 0} photos`;
        
        if (uploads.length === 0) {
          recentGrid.innerHTML = '<p class="recent-empty">No uploads yet</p>';
        } else {
          recentGrid.innerHTML = uploads.slice(0, 8).map(u => 
            `<img class="recent-thumb" src="${u.thumbnail_url}" alt="Upload" loading="lazy">`
          ).join('');
        }
      } catch (err) {
        console.error('Failed to load uploads:', err);
      }
    }
    
    // Load on start
    loadRecentUploads();
  </script>
</body>
</html>
