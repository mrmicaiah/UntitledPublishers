<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    /* Login */
    .login-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-screen.hidden { display: none; }
    .login-logo { font-size: 3rem; margin-bottom: 20px; }
    .login-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 30px; }
    .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; }
    .login-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; display: block; text-align: center; }
    .pin-container { display: flex; gap: 10px; justify-content: center; }
    .pin-digit { width: 50px; height: 60px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; font-size: 1.5rem; font-weight: 700; color: #e2e8f0; text-align: center; }
    .pin-digit:focus { outline: none; border-color: #3b82f6; }
    .pin-digit.error { border-color: #ef4444; animation: shake 0.3s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .login-error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; opacity: 0; }
    .login-error.show { opacity: 1; }
    
    /* Main App */
    .main-app { display: none; height: 100vh; }
    .main-app.visible { display: flex; flex-direction: column; }
    
    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid #1e293b;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 1.3rem; }
    .header-title { font-size: 1rem; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      padding: 6px 12px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; font-size: 0.8rem;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 5px;
      transition: all 0.2s;
    }
    .header-btn:hover { border-color: #64748b; color: #e2e8f0; }
    
    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      overflow: hidden;
    }
    
    /* Left Panel - Scratchpad */
    .left-panel {
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .scratchpad-input {
      padding: 16px;
      border-bottom: 1px solid #334155;
    }
    .scratchpad-textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 0.9rem;
      resize: none;
      min-height: 80px;
    }
    .scratchpad-textarea:focus { outline: none; border-color: #3b82f6; }
    .scratchpad-textarea::placeholder { color: #64748b; }
    .scratchpad-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .scratchpad-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .scratchpad-btn.primary {
      background: #3b82f6;
      color: white;
    }
    .scratchpad-btn.primary:hover { background: #2563eb; }
    .scratchpad-btn.secondary {
      background: #334155;
      color: #94a3b8;
    }
    .scratchpad-btn.secondary:hover { background: #475569; color: #e2e8f0; }
    
    .scratchpad-header {
      padding: 12px 16px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .scratchpad-count {
      background: #334155;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
    }
    .clean-btn {
      background: none;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .clean-btn:hover { border-color: #64748b; color: #e2e8f0; }
    
    .scratchpad-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .scratchpad-item {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .scratchpad-item-text {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .scratchpad-item-time {
      font-size: 0.7rem;
      color: #64748b;
      margin-bottom: 8px;
    }
    .scratchpad-item-actions {
      display: flex;
      gap: 6px;
    }
    .item-btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      transition: all 0.15s;
    }
    .item-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .item-btn.activate { border-color: #22c55e; color: #22c55e; }
    .item-btn.activate:hover { background: #22c55e; color: white; }
    .item-btn.delete { border-color: #ef4444; color: #ef4444; }
    .item-btn.delete:hover { background: #ef4444; color: white; }
    
    .scratchpad-empty {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }
    .scratchpad-empty-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }
    
    /* Right Panel - Work */
    .right-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 24px;
      overflow-y: auto;
    }
    
    /* Section Box */
    .section-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .section-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .section-header:hover { background: rgba(51, 65, 85, 0.3); }
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .section-title .icon { font-size: 1.1rem; }
    .section-badge {
      background: #3b82f6;
      color: white;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .section-badge.danger { background: #ef4444; }
    .section-badge.warning { background: #eab308; }
    .section-badge.muted { background: #475569; }
    .section-badge.orange { background: #f97316; }
    .section-toggle {
      color: #64748b;
      transition: transform 0.2s;
    }
    .section-toggle.collapsed { transform: rotate(-90deg); }
    
    .section-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid #334155;
    }
    .section-body.collapsed { display: none; }
    
    /* Task Row */
    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #0f172a;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .task-row:hover {
      background: #1a2744;
      transform: translateX(4px);
    }
    
    .task-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #475569;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .task-checkbox:hover { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .task-checkbox.completing { background: #22c55e; border-color: #22c55e; }
    .task-checkbox.completing::after { content: '✓'; color: white; font-size: 0.7rem; font-weight: 700; }
    
    .task-content { flex: 1; min-width: 0; }
    .task-text { font-size: 0.9rem; color: #e2e8f0; }
    .task-meta {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .task-tag {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
      background: #334155;
      color: #94a3b8;
    }
    .task-tag.due { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .task-tag.overdue { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .task-tag.due-today { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    
    .task-remove {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      padding: 4px;
      opacity: 0;
      transition: all 0.15s;
    }
    .task-row:hover .task-remove { opacity: 1; }
    .task-remove:hover { color: #ef4444; }
    
    .task-activate {
      background: none;
      border: 1px solid #3b82f6;
      color: #3b82f6;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      opacity: 0;
      transition: all 0.15s;
    }
    .task-row:hover .task-activate { opacity: 1; }
    .task-activate:hover { background: #3b82f6; color: white; }
    
    /* Sprint Section */
    .sprint-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      border-radius: 4px;
      transition: width 0.3s;
    }
    .sprint-stats {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .sprint-objectives {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sprint-objective {
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 6px;
    }
    .sprint-objective-text { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; }
    .sprint-objective-progress { font-size: 0.75rem; color: #64748b; }
    
    /* Orphans Section */
    .orphan-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 6px;
    }
    .orphan-text { flex: 1; font-size: 0.85rem; color: #cbd5e1; }
    .orphan-btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
    }
    .orphan-btn:hover { border-color: #64748b; color: #e2e8f0; }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.5; }
    .empty-title { font-size: 0.95rem; color: #94a3b8; margin-bottom: 4px; }
    .empty-subtitle { font-size: 0.8rem; }
    
    /* Clean Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-item {
      background: #0f172a;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .modal-item-text {
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: #e2e8f0;
    }
    .modal-item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .modal-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      transition: all 0.15s;
    }
    .modal-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .modal-btn.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
    .modal-btn.primary:hover { background: #2563eb; }
    .modal-btn.success { border-color: #22c55e; color: #22c55e; }
    .modal-btn.success:hover { background: #22c55e; color: white; }
    .modal-btn.warning { border-color: #eab308; color: #eab308; }
    .modal-btn.warning:hover { background: #eab308; color: #0f172a; }
    .modal-btn.danger { border-color: #ef4444; color: #ef4444; }
    .modal-btn.danger:hover { background: #ef4444; color: white; }
    
    .scratchpad-zero {
      text-align: center;
      padding: 40px;
    }
    .scratchpad-zero-icon { font-size: 4rem; margin-bottom: 16px; }
    .scratchpad-zero-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
    .scratchpad-zero-subtitle { color: #64748b; }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 30px; color: #64748b; }
    .spinner { width: 20px; height: 20px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Responsive */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .left-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">📋</div>
    <div class="login-title">Dashboard</div>
    <div class="login-box">
      <label class="login-label">Enter your PIN</label>
      <div class="pin-container">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
      </div>
      <div class="login-error" id="loginError">Invalid PIN</div>
    </div>
  </div>

  <div class="main-app" id="mainApp">
    <div class="header">
      <div class="header-left">
        <div class="header-logo">📋</div>
        <div class="header-title">Dashboard</div>
      </div>
      <div class="header-actions">
        <a class="header-btn" href="focus.html">🎯 Focus</a>
        <a class="header-btn" href="projects.html">📁 Projects</a>
        <a class="header-btn" href="index.html">⚙️ Helm</a>
        <button class="header-btn" onclick="loadData()">↻</button>
      </div>
    </div>

    <div class="layout">
      <!-- Left: Scratchpad -->
      <div class="left-panel">
        <div class="scratchpad-input">
          <textarea class="scratchpad-textarea" id="scratchInput" placeholder="What's on your mind?"></textarea>
          <div class="scratchpad-actions">
            <button class="scratchpad-btn primary" onclick="addToScratchpad(true)">+ Active</button>
            <button class="scratchpad-btn secondary" onclick="addToScratchpad(false)">Dump</button>
          </div>
        </div>
        <div class="scratchpad-header">
          <span>Scratchpad <span class="scratchpad-count" id="scratchCount">0</span></span>
          <button class="clean-btn" onclick="openCleanModal()">Clean</button>
        </div>
        <div class="scratchpad-list" id="scratchList">
          <div class="loading"><div class="spinner"></div> Loading...</div>
        </div>
      </div>

      <!-- Right: Work -->
      <div class="right-panel">
        <!-- Active Section - always visible, open by default -->
        <div class="section-box">
          <div class="section-header" onclick="toggleSection('active')">
            <div class="section-title">
              <span class="icon">🎯</span>
              <span>Active</span>
              <span class="section-badge" id="activeCount">0</span>
            </div>
            <span class="section-toggle" id="activeToggle">▼</span>
          </div>
          <div class="section-body" id="activeBody">
            <div class="loading"><div class="spinner"></div> Loading...</div>
          </div>
        </div>

        <!-- Due Section - visible when has items, closed by default -->
        <div class="section-box" id="dueSection">
          <div class="section-header" onclick="toggleSection('due')">
            <div class="section-title">
              <span class="icon">⚠️</span>
              <span>Due</span>
              <span class="section-badge danger" id="dueCount">0</span>
            </div>
            <span class="section-toggle collapsed" id="dueToggle">▼</span>
          </div>
          <div class="section-body collapsed" id="dueBody">
            <div class="empty-state">No due tasks</div>
          </div>
        </div>

        <!-- Sprint Section - visible when has sprint, closed by default -->
        <div class="section-box" id="sprintSection">
          <div class="section-header" onclick="toggleSection('sprint')">
            <div class="section-title">
              <span class="icon">🏃</span>
              <span id="sprintName">Sprint</span>
              <span class="section-badge orange" id="sprintDays">-</span>
            </div>
            <span class="section-toggle collapsed" id="sprintToggle">▼</span>
          </div>
          <div class="section-body collapsed" id="sprintBody">
            <div class="sprint-progress">
              <div class="progress-bar">
                <div class="progress-fill" id="sprintProgress" style="width: 0%"></div>
              </div>
              <span class="sprint-stats" id="sprintStats">0/0</span>
            </div>
            <div class="sprint-objectives" id="sprintObjectives"></div>
            <div id="sprintTasks"></div>
          </div>
        </div>

        <!-- Orphans Section - visible when has items, closed by default -->
        <div class="section-box" id="orphansSection">
          <div class="section-header" onclick="toggleSection('orphans')">
            <div class="section-title">
              <span class="icon">📦</span>
              <span>Orphans</span>
              <span class="section-badge warning" id="orphansCount">0</span>
            </div>
            <span class="section-toggle collapsed" id="orphansToggle">▼</span>
          </div>
          <div class="section-body collapsed" id="orphansBody">
            <div id="orphansList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Clean Modal -->
  <div class="modal-overlay" id="cleanModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Clean Scratchpad</div>
        <button class="modal-close" onclick="closeCleanModal()">&times;</button>
      </div>
      <div class="modal-body" id="cleanModalBody">
        <div class="loading"><div class="spinner"></div> Loading...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const USER_CONFIG = {
      '1987': { name: 'Micaiah', api: 'https://productivity-mcp-server.micaiah-tasks.workers.dev/api' },
      '1976': { name: 'Irene', api: 'https://productivity-irene.micaiah-tasks.workers.dev/api' }
    };
    let API_URL = '', API_KEY = '';
    let scratchpadItems = [];
    let activeTasks = [];
    let dueTasks = [];
    let sprintTasks = [];
    let orphanTasks = [];
    let sprintData = null;

    // Login
    function checkSession() {
      const s = localStorage.getItem('dashboardSession');
      if (s) {
        const { pin, timestamp } = JSON.parse(s);
        if (Date.now() - timestamp < 7*24*60*60*1000 && USER_CONFIG[pin]) {
          API_KEY = pin;
          API_URL = USER_CONFIG[pin].api;
          showMainApp();
          return true;
        }
      }
      return false;
    }

    const pinInputs = document.querySelectorAll('.pin-digit');
    pinInputs.forEach((input, i) => {
      input.addEventListener('input', e => {
        if (e.target.value && i < 3) pinInputs[i+1].focus();
        if (i === 3 && e.target.value) attemptLogin();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) pinInputs[i-1].focus();
      });
    });

    function attemptLogin() {
      const pin = Array.from(pinInputs).map(i => i.value).join('');
      if (USER_CONFIG[pin]) {
        API_KEY = pin;
        API_URL = USER_CONFIG[pin].api;
        localStorage.setItem('dashboardSession', JSON.stringify({ pin, timestamp: Date.now() }));
        showMainApp();
      } else {
        document.getElementById('loginError').classList.add('show');
        pinInputs.forEach(input => { input.classList.add('error'); input.value = ''; });
        pinInputs[0].focus();
        setTimeout(() => {
          document.getElementById('loginError').classList.remove('show');
          pinInputs.forEach(input => input.classList.remove('error'));
        }, 2000);
      }
    }

    function showMainApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.add('visible');
      loadData();
    }

    // API
    async function api(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY };
      try {
        const r = await fetch(API_URL + endpoint, { ...options, headers });
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    // Load all data
    async function loadData() {
      await Promise.all([loadScratchpad(), loadMorning(), loadOrphans()]);
    }

    // Scratchpad
    async function loadScratchpad() {
      const data = await api('/scratchpad');
      scratchpadItems = data?.items || [];
      renderScratchpad();
    }

    function renderScratchpad() {
      document.getElementById('scratchCount').textContent = scratchpadItems.length;
      const list = document.getElementById('scratchList');
      
      if (scratchpadItems.length === 0) {
        list.innerHTML = `
          <div class="scratchpad-empty">
            <div class="scratchpad-empty-icon">✨</div>
            <div>Scratchpad is clear</div>
          </div>
        `;
        return;
      }

      list.innerHTML = scratchpadItems.map(item => `
        <div class="scratchpad-item" data-id="${item.id}">
          <div class="scratchpad-item-text">${esc(item.text)}</div>
          <div class="scratchpad-item-time">${formatTime(item.created_at)}</div>
          <div class="scratchpad-item-actions">
            <button class="item-btn activate" onclick="processScratchpad('${item.id}', 'activate')">✓ Active</button>
            <button class="item-btn" onclick="processScratchpad('${item.id}', 'task')">→ Task</button>
            <button class="item-btn" onclick="processScratchpad('${item.id}', 'orphan')">→ Orphan</button>
            <button class="item-btn delete" onclick="processScratchpad('${item.id}', 'delete')">🗑</button>
          </div>
        </div>
      `).join('');
    }

    async function addToScratchpad(makeActive) {
      const input = document.getElementById('scratchInput');
      const text = input.value.trim();
      if (!text) return;

      if (makeActive) {
        const result = await api('/tasks', {
          method: 'POST',
          body: JSON.stringify({ text, category: 'General', priority: 3 })
        });
        if (result?.id) {
          await api(`/tasks/${result.id}/activate`, { method: 'POST' });
          showToast('Task added & activated');
          input.value = '';
          loadMorning();
        }
      } else {
        const result = await api('/scratchpad', {
          method: 'POST',
          body: JSON.stringify({ text })
        });
        if (result?.success) {
          showToast('Added to scratchpad');
          input.value = '';
          loadScratchpad();
        }
      }
    }

    async function processScratchpad(id, action) {
      const result = await api(`/scratchpad/${id}/process`, {
        method: 'POST',
        body: JSON.stringify({ action })
      });
      if (result?.success) {
        const messages = {
          activate: 'Task activated!',
          task: 'Moved to tasks',
          orphan: 'Moved to orphans',
          delete: 'Deleted'
        };
        showToast(messages[action] || 'Done');
        loadScratchpad();
        if (action === 'activate') loadMorning();
        if (action === 'orphan') loadOrphans();
      }
    }

    // Morning data
    async function loadMorning() {
      const data = await api('/morning');
      if (!data) return;

      activeTasks = data.activeTasks || [];
      sprintTasks = data.sprintTasks || [];
      sprintData = data.sprint;
      
      // Build due tasks: overdue + due today (not active)
      const today = new Date().toISOString().split('T')[0];
      dueTasks = [...(data.overdueTasks || [])];
      
      // Also check backlog for tasks due today
      const backlog = data.backlogByCategory || {};
      for (const cat in backlog) {
        for (const task of backlog[cat]) {
          if (task.due_date === today && !task.is_active) {
            // Check not already in dueTasks
            if (!dueTasks.find(t => t.id === task.id)) {
              dueTasks.push(task);
            }
          }
        }
      }
      
      // Sort: overdue first, then by date
      dueTasks.sort((a, b) => {
        if (a.due_date < today && b.due_date >= today) return -1;
        if (a.due_date >= today && b.due_date < today) return 1;
        return a.due_date.localeCompare(b.due_date);
      });
      
      renderActive();
      renderDue();
      renderSprint();
    }

    function renderActive() {
      document.getElementById('activeCount').textContent = activeTasks.length;
      const body = document.getElementById('activeBody');
      
      if (activeTasks.length === 0) {
        body.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎯</div>
            <div class="empty-title">No active tasks</div>
            <div class="empty-subtitle">Add something to your scratchpad and activate it</div>
          </div>
        `;
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      body.innerHTML = activeTasks.map(t => {
        let dueBadge = '';
        if (t.due_date) {
          if (t.due_date < today) dueBadge = '<span class="task-tag overdue">Overdue</span>';
          else if (t.due_date === today) dueBadge = '<span class="task-tag due-today">Due today</span>';
          else dueBadge = `<span class="task-tag due">${formatDate(t.due_date)}</span>`;
        }
        
        return `
          <div class="task-row" data-id="${t.id}">
            <div class="task-checkbox" onclick="completeTask('${t.id}', this)"></div>
            <div class="task-content">
              <div class="task-text">${esc(t.text)}</div>
              <div class="task-meta">
                ${dueBadge}
                ${t.category ? `<span class="task-tag">${esc(t.category)}</span>` : ''}
              </div>
            </div>
            <button class="task-remove" onclick="deactivateTask('${t.id}')" title="Remove from active">✕</button>
          </div>
        `;
      }).join('');
    }

    function renderDue() {
      const section = document.getElementById('dueSection');
      document.getElementById('dueCount').textContent = dueTasks.length;
      
      if (dueTasks.length === 0) {
        section.style.display = 'none';
        return;
      }
      
      section.style.display = 'block';
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dueBody').innerHTML = dueTasks.map(t => {
        const isOverdue = t.due_date < today;
        return `
          <div class="task-row" data-id="${t.id}">
            <div class="task-checkbox" onclick="completeTask('${t.id}', this)"></div>
            <div class="task-content">
              <div class="task-text">${esc(t.text)}</div>
              <div class="task-meta">
                <span class="task-tag ${isOverdue ? 'overdue' : 'due-today'}">${isOverdue ? 'Overdue: ' : 'Today: '}${formatDate(t.due_date)}</span>
                ${t.category ? `<span class="task-tag">${esc(t.category)}</span>` : ''}
              </div>
            </div>
            <button class="task-activate" onclick="activateTask('${t.id}')">Activate</button>
          </div>
        `;
      }).join('');
    }

    function renderSprint() {
      const section = document.getElementById('sprintSection');
      
      if (!sprintData) {
        section.style.display = 'none';
        return;
      }
      
      section.style.display = 'block';
      document.getElementById('sprintName').textContent = sprintData.name;
      document.getElementById('sprintDays').textContent = `${sprintData.daysRemaining}d left`;
      
      const objs = sprintData.objectives || [];
      let total = 0, done = 0;
      objs.forEach(o => { total += o.totalTasks || 0; done += o.doneTasks || 0; });
      const pct = total > 0 ? Math.round(done/total*100) : 0;
      
      document.getElementById('sprintProgress').style.width = pct + '%';
      document.getElementById('sprintStats').textContent = `${done}/${total} (${pct}%)`;
      
      document.getElementById('sprintObjectives').innerHTML = objs.map(o => `
        <div class="sprint-objective">
          <div class="sprint-objective-text">${esc(o.statement)}</div>
          <div class="sprint-objective-progress">${o.doneTasks}/${o.totalTasks} tasks complete</div>
        </div>
      `).join('');
      
      const nonActiveSprint = sprintTasks.filter(t => !t.is_active);
      if (nonActiveSprint.length > 0) {
        document.getElementById('sprintTasks').innerHTML = `
          <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #334155;">
            <div style="font-size: 0.75rem; color: #64748b; margin-bottom: 8px;">Sprint Queue</div>
            ${nonActiveSprint.map(t => `
              <div class="task-row" data-id="${t.id}">
                <div class="task-checkbox" onclick="completeTask('${t.id}', this)"></div>
                <div class="task-content">
                  <div class="task-text">${esc(t.text)}</div>
                </div>
                <button class="task-activate" onclick="activateTask('${t.id}')">Activate</button>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        document.getElementById('sprintTasks').innerHTML = '';
      }
    }

    // Orphans
    async function loadOrphans() {
      const data = await api('/orphans');
      orphanTasks = data?.tasks || [];
      renderOrphans();
    }

    function renderOrphans() {
      const section = document.getElementById('orphansSection');
      document.getElementById('orphansCount').textContent = orphanTasks.length;
      
      if (orphanTasks.length === 0) {
        section.style.display = 'none';
        return;
      }
      
      section.style.display = 'block';
      
      document.getElementById('orphansList').innerHTML = orphanTasks.map(t => `
        <div class="orphan-row">
          <div class="orphan-text">${esc(t.text)}</div>
          <button class="orphan-btn" onclick="activateTask('${t.id}')">Activate</button>
        </div>
      `).join('');
    }

    // Task actions
    async function completeTask(id, checkbox) {
      checkbox.classList.add('completing');
      const result = await api(`/tasks/${id}/complete`, { method: 'POST' });
      if (result?.success) {
        showToast('Task completed! 🎉');
        setTimeout(() => loadMorning(), 300);
      } else {
        checkbox.classList.remove('completing');
      }
    }

    async function deactivateTask(id) {
      await api(`/tasks/${id}/deactivate`, { method: 'POST' });
      showToast('Removed from active');
      loadMorning();
    }

    async function activateTask(id) {
      await api(`/tasks/${id}/activate`, { method: 'POST' });
      showToast('Task activated');
      loadMorning();
      loadOrphans();
    }

    // Section toggle
    function toggleSection(name) {
      const body = document.getElementById(name + 'Body');
      const toggle = document.getElementById(name + 'Toggle');
      body.classList.toggle('collapsed');
      toggle.classList.toggle('collapsed');
    }

    // Clean Modal
    function openCleanModal() {
      document.getElementById('cleanModal').classList.add('active');
      renderCleanModal();
    }

    function closeCleanModal() {
      document.getElementById('cleanModal').classList.remove('active');
    }

    function renderCleanModal() {
      const body = document.getElementById('cleanModalBody');
      
      if (scratchpadItems.length === 0) {
        body.innerHTML = `
          <div class="scratchpad-zero">
            <div class="scratchpad-zero-icon">🎉</div>
            <div class="scratchpad-zero-title">Scratchpad Zero!</div>
            <div class="scratchpad-zero-subtitle">Nothing to clean up</div>
          </div>
        `;
        return;
      }

      body.innerHTML = scratchpadItems.map(item => `
        <div class="modal-item" data-id="${item.id}">
          <div class="modal-item-text">${esc(item.text)}</div>
          <div class="modal-item-actions">
            <button class="modal-btn success" onclick="processAndNext('${item.id}', 'activate')">✓ Activate</button>
            <button class="modal-btn" onclick="processAndNext('${item.id}', 'task')">→ Task</button>
            <button class="modal-btn warning" onclick="processAndNext('${item.id}', 'orphan')">→ Orphan</button>
            <button class="modal-btn danger" onclick="processAndNext('${item.id}', 'delete')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function processAndNext(id, action) {
      await processScratchpad(id, action);
      renderCleanModal();
    }

    // Helpers
    function formatTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const diffMs = now - d;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      if (diffMins < 1) return 'just now';
      if (diffMins < 60) return diffMins + 'm ago';
      if (diffHours < 24) return diffHours + 'h ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function esc(s) {
      return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Enter key for scratchpad
    document.getElementById('scratchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addToScratchpad(false);
      }
      if (e.key === 'Enter' && e.shiftKey) {
        e.preventDefault();
        addToScratchpad(true);
      }
    });

    // Close modal on overlay click
    document.getElementById('cleanModal').addEventListener('click', e => {
      if (e.target.id === 'cleanModal') closeCleanModal();
    });

    // Init
    if (!checkSession()) pinInputs[0].focus();
  </script>
</body>
</html>
