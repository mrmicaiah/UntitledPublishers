<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    /* ========== SHARED NAV BAR ========== */
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { display: flex; align-items: center; gap: 8px; }
    .nav-logo { font-size: 1.2rem; }
    .nav-title { font-size: 0.95rem; font-weight: 600; }
    
    .nav-links { display: flex; align-items: center; gap: 6px; }
    .nav-link {
      padding: 6px 10px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; font-size: 0.75rem;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px;
      transition: all 0.2s; font-family: inherit; white-space: nowrap;
    }
    .nav-link:hover { border-color: #64748b; color: #e2e8f0; }
    .nav-link.active { background: #334155; color: #e2e8f0; border-color: #475569; }
    .nav-link.claude { border-color: #f97316; color: #f97316; }
    .nav-link.claude:hover { background: #f97316; color: white; }
    .nav-link.helm { border-color: #f97316; color: #f97316; }
    .nav-link.helm:hover { background: #f97316; color: white; }
    .nav-link.projects { border-color: #14b8a6; color: #14b8a6; }
    .nav-link.projects:hover { background: #14b8a6; color: white; }
    .nav-link.planning { border-color: #3b82f6; color: #3b82f6; }
    .nav-link.planning:hover { background: #3b82f6; color: white; }
    .nav-link.doing { border-color: #22c55e; color: #22c55e; }
    .nav-link.doing:hover { background: #22c55e; color: white; }
    .nav-link.courier { border-color: #a855f7; color: #a855f7; }
    .nav-link.courier:hover { background: #a855f7; color: white; }
    .nav-link.messages { border-color: #ec4899; color: #ec4899; }
    .nav-link.messages:hover { background: #ec4899; color: white; }
    .nav-link.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
    .nav-link.primary:hover { background: #2563eb; }
    
    .nav-badge { background: #ef4444; color: white; font-size: 0.6rem; padding: 1px 5px; border-radius: 8px; margin-left: 3px; }
    .nav-badge.hidden { display: none; }
    
    .nav-icon-btn {
      padding: 6px 8px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-icon-btn:hover { border-color: #64748b; color: #e2e8f0; }
    
    .nav-hamburger {
      display: none; padding: 8px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 1.2rem;
    }
    .nav-hamburger:hover { border-color: #64748b; color: #e2e8f0; }
    
    .nav-mobile {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      background: #1e293b; border-bottom: 1px solid #334155;
      padding: 12px; z-index: 100; flex-direction: column; gap: 8px;
    }
    .nav-mobile.open { display: flex; }
    .nav-mobile .nav-link { justify-content: center; padding: 10px; }
    
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
    }
    /* ========== END SHARED NAV BAR ========== */
    
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .page-title { font-size: 1.3rem; font-weight: 600; }
    .header-actions { display: flex; gap: 10px; }
    
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #64748b; }
    
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.875rem;
      font-family: inherit;
    }
    .tab.active { background: #1e293b; color: #e2e8f0; }
    .tab:hover { color: #e2e8f0; }
    
    .owner-section { margin-bottom: 30px; }
    .owner-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .owner-icon { font-size: 1.2rem; }
    .owner-name { font-size: 1.1rem; font-weight: 600; }
    .owner-count {
      background: #334155;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    
    .health {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .health.on_track { background: #22c55e; }
    .health.ahead { background: #3b82f6; }
    .health.at_risk { background: #eab308; }
    .health.blocked { background: #ef4444; }
    
    .card-goal {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    
    .card-stats {
      display: flex;
      gap: 15px;
      font-size: 0.75rem;
      color: #64748b;
    }
    .stat { display: flex; align-items: center; gap: 4px; }
    .stat-icon { font-size: 0.875rem; }
    
    .progress-bar {
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin-top: 15px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      border-radius: 2px;
      transition: width 0.3s;
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      overflow-y: auto;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    
    .modal {
      background: #1e293b;
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      border: 1px solid #334155;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      border-bottom: 1px solid #334155;
    }
    .modal-title { font-size: 1.25rem; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-close:hover { color: #e2e8f0; }
    
    .modal-body { padding: 25px; }
    
    .section {
      margin-bottom: 25px;
    }
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 12px;
    }
    
    .phase-list, .milestone-list, .blocker-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .phase-item, .milestone-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 8px;
    }
    .phase-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
    }
    .phase-status.completed { background: #22c55e; }
    .phase-status.active { background: #3b82f6; }
    
    .blocker-item {
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      border-left: 3px solid #eab308;
    }
    .blocker-item.high { border-color: #ef4444; }
    .blocker-item.low { border-color: #22c55e; }
    
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .timeline-item {
      display: flex;
      gap: 12px;
      font-size: 0.875rem;
    }
    .timeline-date {
      color: #64748b;
      min-width: 80px;
    }
    .timeline-content { color: #cbd5e1; }
    
    /* Checkin Form */
    .checkin-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
    }
    .form-group textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    /* Ideas Pipeline */
    .pipeline {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .pipeline-column {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
    }
    .pipeline-header {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }
    .pipeline-count {
      background: #334155;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }
    .idea-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.875rem;
    }
    .idea-card:last-child { margin-bottom: 0; }
    .idea-appetite {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 6px;
    }
    
    /* Empty State */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 15px; }
    .section-empty { text-align: center; padding: 20px; color: #64748b; font-size: 0.875rem; }
    
    /* Messages Modal */
    .message-item { padding: 14px; background: #0f172a; border-radius: 8px; margin-bottom: 12px; }
    .message-item:last-child { margin-bottom: 0; }
    .message-from { font-size: 0.8rem; color: #ec4899; font-weight: 600; margin-bottom: 4px; }
    .message-content { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px; line-height: 1.4; }
    .message-footer { display: flex; justify-content: space-between; align-items: center; }
    .message-time { font-size: 0.7rem; color: #64748b; }
    .message-actions { display: flex; gap: 6px; }
    .message-btn {
      padding: 5px 12px; border-radius: 4px; font-size: 0.75rem;
      cursor: pointer; border: 1px solid #334155; background: transparent;
      color: #94a3b8; transition: all 0.15s; font-family: inherit;
    }
    .message-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .message-btn.activate { border-color: #22c55e; color: #22c55e; }
    .message-btn.activate:hover { background: #22c55e; color: white; }
    .messages-empty { text-align: center; padding: 40px; color: #64748b; }
    .messages-empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
    
    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Create Modal */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    @media (max-width: 768px) {
      .pipeline { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Shared Nav Bar -->
  <nav class="nav-bar">
    <div class="nav-brand">
      <span class="nav-logo">📊</span>
      <span class="nav-title">Projects</span>
    </div>
    <div class="nav-links">
      <a class="nav-link claude" href="https://claude.ai" target="_blank">🤖 Claude</a>
      <a class="nav-link helm" href="index.html">🚀 Helm</a>
      <a class="nav-link planning" href="planning.html">📋 Planning</a>
      <a class="nav-link doing" href="doing.html">🎯 Doing</a>
      <a class="nav-link courier" href="/emailbot/">📧 Courier</a>
      <button class="nav-link messages" id="msgBtn" onclick="openMessagesModal()">💬<span class="nav-badge hidden" id="msgBadge">0</span></button>
      <button class="nav-link primary" onclick="showCreateModal()">+ Project</button>
      <button class="nav-icon-btn" onclick="fetchProjects('active')">↻</button>
    </div>
    <button class="nav-hamburger" onclick="toggleMobileMenu()">☰</button>
    <div class="nav-mobile" id="navMobile">
      <a class="nav-link claude" href="https://claude.ai" target="_blank">🤖 Claude</a>
      <a class="nav-link helm" href="index.html">🚀 Helm</a>
      <a class="nav-link planning" href="planning.html">📋 Planning</a>
      <a class="nav-link doing" href="doing.html">🎯 Doing</a>
      <a class="nav-link courier" href="/emailbot/">📧 Courier</a>
      <button class="nav-link messages" id="msgBtnMobile" onclick="openMessagesModal()">💬 Messages <span class="nav-badge hidden" id="msgBadgeMobile">0</span></button>
      <button class="nav-link primary" onclick="showCreateModal()">+ Project</button>
      <button class="nav-link" onclick="fetchProjects('active')">↻ Refresh</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="tabs">
        <button class="tab active" data-tab="active" onclick="filterProjects('active')">Active</button>
        <button class="tab" data-tab="completed" onclick="filterProjects('completed')">Completed</button>
        <button class="tab" data-tab="all" onclick="filterProjects('all')">All</button>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="showTab('ideas')">Ideas Pipeline</button>
      </div>
    </div>

    <div id="projects-view">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <div id="ideas-view" style="display: none;">
      <div style="margin-bottom: 15px;"><button class="btn btn-secondary" onclick="showTab('projects')">← Back to Projects</button></div>
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Messages Modal -->
  <div class="modal-overlay" id="messages-modal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title">💬 Messages</div>
        <button class="modal-close" onclick="closeMessagesModal()">&times;</button>
      </div>
      <div class="modal-body" id="messages-modal-body"></div>
    </div>
  </div>

  <!-- Project Detail Modal -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Project</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- Create Project Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">New Project</div>
        <button class="modal-close" onclick="closeCreateModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form class="checkin-form" onsubmit="createProject(event)">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="create-title" required>
          </div>
          <div class="form-group">
            <label>Goal</label>
            <textarea id="create-goal" rows="2"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Target Date</label>
              <input type="date" id="create-date">
            </div>
            <div class="form-group">
              <label>Template</label>
              <select id="create-template">
                <option value="">None</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn">Create Project</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const APIS = {
      micaiah: 'https://productivity-mcp-server.micaiah-tasks.workers.dev/api',
      irene: 'https://productivity-irene.micaiah-tasks.workers.dev/api'
    };
    
    let micaiahProjects = [];
    let ireneProjects = [];
    let templates = [];
    let messages = [];
    let currentModalOwner = null;

    // Mobile menu
    function toggleMobileMenu() {
      document.getElementById('navMobile').classList.toggle('open');
    }

    // Close mobile menu when clicking outside
    document.addEventListener('click', e => {
      const nav = document.getElementById('navMobile');
      const hamburger = document.querySelector('.nav-hamburger');
      if (nav.classList.contains('open') && !nav.contains(e.target) && !hamburger.contains(e.target)) {
        nav.classList.remove('open');
      }
    });

    // Messages
    async function loadMessages() {
      try {
        const res = await fetch(`${APIS.micaiah}/messages`, {
          headers: { 'Authorization': 'Bearer 1987' }
        });
        const data = await res.json();
        messages = data?.messages || [];
        renderMessagesButton();
      } catch (e) {
        console.error('Failed to load messages:', e);
      }
    }

    function renderMessagesButton() {
      const badges = [document.getElementById('msgBadge'), document.getElementById('msgBadgeMobile')];
      badges.forEach(badge => {
        if (messages.length > 0) {
          badge.textContent = messages.length;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      });
    }

    function openMessagesModal() {
      const body = document.getElementById('messages-modal-body');
      if (messages.length === 0) {
        body.innerHTML = '<div class="messages-empty"><div class="messages-empty-icon">📭</div><div>No messages</div></div>';
      } else {
        body.innerHTML = messages.map(m => `
          <div class="message-item">
            <div class="message-from">${escapeHtml(m.from_user)}</div>
            <div class="message-content">${escapeHtml(m.content)}</div>
            <div class="message-footer">
              <span class="message-time">${formatTime(m.created_at)}</span>
            </div>
          </div>
        `).join('');
      }
      document.getElementById('messages-modal').classList.add('active');
    }

    function closeMessagesModal() {
      document.getElementById('messages-modal').classList.remove('active');
      fetch(`${APIS.micaiah}/messages/read`, { 
        method: 'POST',
        headers: { 'Authorization': 'Bearer 1987' }
      });
      messages = [];
      renderMessagesButton();
    }

    function formatTime(ts) {
      const d = new Date(ts), now = new Date(), diff = Math.floor((now - d) / 60000);
      if (diff < 1) return 'just now';
      if (diff < 60) return diff + 'm ago';
      if (diff < 1440) return Math.floor(diff/60) + 'h ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    async function fetchProjects(status = 'active') {
      try {
        const [micaiahRes, ireneRes] = await Promise.allSettled([
          fetch(`${APIS.micaiah}/projects?status=${status}`).then(r => r.json()),
          fetch(`${APIS.irene}/projects?status=${status}`).then(r => r.json())
        ]);
        
        micaiahProjects = micaiahRes.status === 'fulfilled' ? (micaiahRes.value.projects || []) : [];
        ireneProjects = ireneRes.status === 'fulfilled' ? (ireneRes.value.projects || []) : [];
        
        renderProjects();
      } catch (e) {
        console.error('Failed to fetch projects:', e);
        document.getElementById('projects-view').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Failed to load projects</p></div>';
      }
    }

    function renderProjects() {
      const container = document.getElementById('projects-view');
      
      if (micaiahProjects.length === 0 && ireneProjects.length === 0) {
        container.innerHTML = '<div class="empty"><div class="empty-icon">📁</div><p>No projects yet</p></div>';
        return;
      }

      container.innerHTML = `
        <div class="owner-section">
          <div class="owner-header">
            <span class="owner-icon">👨‍💻</span>
            <span class="owner-name">Micaiah</span>
            <span class="owner-count">${micaiahProjects.length}</span>
          </div>
          ${micaiahProjects.length > 0 ? `<div class="grid">${micaiahProjects.map(p => projectCard(p, 'micaiah')).join('')}</div>` : '<div class="section-empty">No projects</div>'}
        </div>
        <div class="owner-section">
          <div class="owner-header">
            <span class="owner-icon">👩‍💻</span>
            <span class="owner-name">Irene</span>
            <span class="owner-count">${ireneProjects.length}</span>
          </div>
          ${ireneProjects.length > 0 ? `<div class="grid">${ireneProjects.map(p => projectCard(p, 'irene')).join('')}</div>` : '<div class="section-empty">No projects</div>'}
        </div>
      `;
    }

    function projectCard(p, owner) {
      return `
        <div class="card" onclick="openProject('${p.id}', '${owner}')">
          <div class="card-header">
            <div class="card-title">${escapeHtml(p.title)}</div>
            <div class="health ${p.health}" title="${p.health}"></div>
          </div>
          ${p.goal ? `<div class="card-goal">${escapeHtml(p.goal.slice(0, 100))}${p.goal.length > 100 ? '...' : ''}</div>` : ''}
          <div class="card-stats">
            <div class="stat"><span class="stat-icon">📋</span> ${p.phases.done}/${p.phases.total} phases</div>
            <div class="stat"><span class="stat-icon">🎯</span> ${p.milestones.done}/${p.milestones.total} milestones</div>
            ${p.blockerCount > 0 ? `<div class="stat"><span class="stat-icon">🚧</span> ${p.blockerCount} blockers</div>` : ''}
          </div>
          ${p.milestones.total > 0 ? `
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${Math.round((p.milestones.done / p.milestones.total) * 100)}%"></div>
            </div>
          ` : ''}
        </div>
      `;
    }

    async function openProject(id, owner) {
      currentModalOwner = owner;
      document.getElementById('project-modal').classList.add('active');
      document.getElementById('modal-body').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      
      try {
        const res = await fetch(`${APIS[owner]}/projects/${id}`);
        const data = await res.json();
        renderProjectDetail(data, owner);
      } catch (e) {
        document.getElementById('modal-body').innerHTML = '<div class="empty">Failed to load project</div>';
      }
    }

    function renderProjectDetail(data, owner) {
      const { project, phases, milestones, blockers, updates, checkins } = data;
      document.getElementById('modal-title').textContent = project.title;
      
      const activeBlockers = blockers.filter(b => b.status === 'active');
      
      document.getElementById('modal-body').innerHTML = `
        <div class="section">
          <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <div><strong>Status:</strong> ${project.status}</div>
            <div><strong>Health:</strong> <span class="health ${project.health}" style="display: inline-block; vertical-align: middle;"></span> ${project.health}</div>
            ${project.target_date ? `<div><strong>Target:</strong> ${project.target_date}</div>` : ''}
          </div>
          ${project.goal ? `<p style="color: #94a3b8; margin-bottom: 10px;"><strong>Goal:</strong> ${escapeHtml(project.goal)}</p>` : ''}
          ${project.purpose ? `<p style="color: #94a3b8;"><strong>Purpose:</strong> ${escapeHtml(project.purpose)}</p>` : ''}
        </div>

        ${phases.length > 0 ? `
          <div class="section">
            <div class="section-title">Phases</div>
            <div class="phase-list">
              ${phases.map(p => `
                <div class="phase-item">
                  <div class="phase-status ${p.status}"></div>
                  <span>${escapeHtml(p.name)}</span>
                  <span style="margin-left: auto; color: #64748b; font-size: 0.75rem;">${p.status}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${milestones.length > 0 ? `
          <div class="section">
            <div class="section-title">Milestones</div>
            <div class="milestone-list">
              ${milestones.map(m => `
                <div class="milestone-item">
                  <div class="phase-status ${m.status}"></div>
                  <span>${escapeHtml(m.title)}</span>
                  ${m.target_date ? `<span style="margin-left: auto; color: #64748b; font-size: 0.75rem;">${m.target_date}</span>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${activeBlockers.length > 0 ? `
          <div class="section">
            <div class="section-title">Active Blockers</div>
            <div class="blocker-list">
              ${activeBlockers.map(b => `
                <div class="blocker-item ${b.severity}">
                  <div style="display: flex; justify-content: space-between;">
                    <span>${escapeHtml(b.description)}</span>
                    <span style="color: #64748b; font-size: 0.75rem;">${b.severity}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div class="section">
          <div class="section-title">Quick Check-in</div>
          <form class="checkin-form" onsubmit="submitCheckin(event, '${project.id}', '${owner}')">
            <div class="form-group">
              <label>Wins</label>
              <textarea id="checkin-wins" rows="2" placeholder="What went well?"></textarea>
            </div>
            <div class="form-group">
              <label>Struggles</label>
              <textarea id="checkin-struggles" rows="2" placeholder="What's blocking you?"></textarea>
            </div>
            <div class="form-group">
              <label>Next Focus</label>
              <textarea id="checkin-focus" rows="2" placeholder="What's next?"></textarea>
            </div>
            <button type="submit" class="btn">Submit Check-in</button>
          </form>
        </div>

        ${updates.length > 0 ? `
          <div class="section">
            <div class="section-title">Recent Activity</div>
            <div class="timeline">
              ${updates.slice(0, 10).map(u => `
                <div class="timeline-item">
                  <div class="timeline-date">${u.created_at.split('T')[0]}</div>
                  <div class="timeline-content">${escapeHtml(u.content || u.update_type)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;
    }

    async function submitCheckin(e, projectId, owner) {
      e.preventDefault();
      const wins = document.getElementById('checkin-wins').value;
      const struggles = document.getElementById('checkin-struggles').value;
      const next_focus = document.getElementById('checkin-focus').value;
      
      if (!wins && !struggles && !next_focus) {
        alert('Please fill in at least one field');
        return;
      }
      
      try {
        await fetch(`${APIS[owner]}/projects/${projectId}/checkin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wins, struggles, next_focus })
        });
        alert('Check-in saved!');
        openProject(projectId, owner);
      } catch (e) {
        alert('Failed to save check-in');
      }
    }

    function closeModal() {
      document.getElementById('project-modal').classList.remove('active');
      currentModalOwner = null;
    }

    function filterProjects(status) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${status}"]`).classList.add('active');
      document.getElementById('projects-view').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      fetchProjects(status);
    }

    // Ideas
    async function fetchIdeas() {
      try {
        const res = await fetch(`${APIS.micaiah}/ideas`);
        const data = await res.json();
        renderIdeas(data);
      } catch (e) {
        document.getElementById('ideas-view').innerHTML = '<div style="margin-bottom: 15px;"><button class="btn btn-secondary" onclick="showTab(\'projects\')">← Back to Projects</button></div><div class="empty">Failed to load ideas</div>';
      }
    }

    function renderIdeas(data) {
      const { raw, shaped, ready } = data;
      document.getElementById('ideas-view').innerHTML = `
        <div style="margin-bottom: 15px;"><button class="btn btn-secondary" onclick="showTab('projects')">← Back to Projects</button></div>
        <div class="pipeline">
          <div class="pipeline-column">
            <div class="pipeline-header">
              <span>Raw</span>
              <span class="pipeline-count">${raw.length}</span>
            </div>
            ${raw.map(i => `<div class="idea-card">${escapeHtml(i.title)}</div>`).join('') || '<p style="color: #64748b; font-size: 0.875rem;">No raw ideas</p>'}
          </div>
          <div class="pipeline-column">
            <div class="pipeline-header">
              <span>Shaped</span>
              <span class="pipeline-count">${shaped.length}</span>
            </div>
            ${shaped.map(i => `
              <div class="idea-card">
                ${escapeHtml(i.title)}
                ${i.appetite ? `<div class="idea-appetite">${i.appetite}</div>` : ''}
              </div>
            `).join('') || '<p style="color: #64748b; font-size: 0.875rem;">No shaped ideas</p>'}
          </div>
          <div class="pipeline-column">
            <div class="pipeline-header">
              <span>Ready</span>
              <span class="pipeline-count">${ready.length}</span>
            </div>
            ${ready.map(i => `
              <div class="idea-card">
                ${escapeHtml(i.title)}
                ${i.appetite ? `<div class="idea-appetite">${i.appetite}</div>` : ''}
              </div>
            `).join('') || '<p style="color: #64748b; font-size: 0.875rem;">No ready ideas</p>'}
          </div>
        </div>
      `;
    }

    function showTab(tab) {
      if (tab === 'ideas') {
        document.getElementById('projects-view').style.display = 'none';
        document.getElementById('ideas-view').style.display = 'block';
        document.querySelector('.page-header').style.display = 'none';
        fetchIdeas();
      } else {
        document.getElementById('projects-view').style.display = 'block';
        document.getElementById('ideas-view').style.display = 'none';
        document.querySelector('.page-header').style.display = 'flex';
      }
    }

    // Create Project
    async function fetchTemplates() {
      try {
        const res = await fetch(`${APIS.micaiah}/templates`);
        const data = await res.json();
        templates = data.templates || [];
        const select = document.getElementById('create-template');
        select.innerHTML = '<option value="">None</option>' + 
          templates.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
      } catch (e) {
        console.error('Failed to fetch templates:', e);
      }
    }

    function showCreateModal() {
      fetchTemplates();
      document.getElementById('create-modal').classList.add('active');
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('active');
    }

    async function createProject(e) {
      e.preventDefault();
      const title = document.getElementById('create-title').value;
      const goal = document.getElementById('create-goal').value;
      const target_date = document.getElementById('create-date').value;
      const template_id = document.getElementById('create-template').value;
      
      try {
        await fetch(`${APIS.micaiah}/projects`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, goal, target_date, template_id })
        });
        closeCreateModal();
        fetchProjects('active');
      } catch (e) {
        alert('Failed to create project');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.remove('active');
        }
      });
    });

    // Init
    fetchProjects();
    loadMessages();
  </script>
</body>
</html>
