<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Helm - Productivity</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-400: #60a5fa;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;
      --gray-900: #111827;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-400: #9ca3af;
      --gray-300: #d1d5db;
      --gray-200: #e5e7eb;
      --gray-100: #f3f4f6;
      --gray-50: #f9fafb;
      --white: #ffffff;
      --green-600: #16a34a;
      --green-500: #22c55e;
      --green-100: #dcfce7;
      --red-600: #dc2626;
      --red-500: #ef4444;
      --red-100: #fee2e2;
      --yellow-600: #ca8a04;
      --yellow-500: #eab308;
      --yellow-100: #fef9c3;
      --purple-600: #9333ea;
      --purple-100: #f3e8ff;
      --orange-500: #f97316;
      --orange-100: #ffedd5;
      --claude-orange: #da7756;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      line-height: 1.5;
      min-height: 100vh;
    }
    
    .login-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, var(--blue-50) 0%, var(--white) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    
    .login-screen.hidden { display: none; }
    
    .login-logo {
      width: 64px;
      height: 64px;
      background: var(--blue-500);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 20px;
    }
    
    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 4px;
    }
    
    .login-subtitle {
      font-size: 0.95rem;
      color: var(--gray-500);
      margin-bottom: 32px;
    }
    
    .login-box {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      padding: 32px 40px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }
    
    .login-label {
      font-size: 0.85rem;
      color: var(--gray-500);
      margin-bottom: 16px;
      display: block;
      text-align: center;
    }
    
    .pin-input-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 8px;
    }
    
    .pin-digit {
      width: 56px;
      height: 64px;
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gray-900);
      text
