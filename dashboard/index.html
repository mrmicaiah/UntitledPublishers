<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    /* Login */
    .login-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-screen.hidden { display: none; }
    .login-logo { font-size: 3rem; margin-bottom: 20px; }
    .login-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 30px; }
    .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; }
    .login-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; display: block; text-align: center; }
    .pin-container { display: flex; gap: 10px; justify-content: center; }
    .pin-digit { width: 50px; height: 60px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; font-size: 1.5rem; font-weight: 700; color: #e2e8f0; text-align: center; }
    .pin-digit:focus { outline: none; border-color: #3b82f6; }
    .pin-digit.error { border-color: #ef4444; animation: shake 0.3s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .login-error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; opacity: 0; }
    .login-error.show { opacity: 1; }
    
    /* Main App */
    .main-app { display: none; height: 100vh; }
    .main-app.visible { display: flex; flex-direction: column; }
    
    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid #1e293b;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 1.3rem; }
    .header-title { font-size: 1rem; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      padding: 6px 12px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; font-size: 0.8rem;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 5px;
      transition: all 0.2s; font-family: inherit;
    }
    .header-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .header-btn.doing { border-color: #22c55e; color: #22c55e; }
    .header-btn.doing:hover { background: #22c55e; color: white; }
    .header-btn.planning { border-color: #3b82f6; color: #3b82f6; }
    .header-btn.planning:hover { background: #3b82f6; color: white; }
    .msg-badge { background: #ef4444; color: white; font-size: 0.65rem; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
    
    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      overflow: hidden;
    }
    
    /* Left Panel - Scratchpad */
    .left-panel {
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .scratchpad-input { padding: 16px; border-bottom: 1px solid #334155; }
    .scratchpad-textarea {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; padding: 12px; color: #e2e8f0;
      font-family: inherit; font-size: 0.9rem; resize: none; min-height: 80px;
    }
    .scratchpad-textarea:focus { outline: none; border-color: #3b82f6; }
    .scratchpad-textarea::placeholder { color: #64748b; }
    .scratchpad-actions { display: flex; gap: 8px; margin-top: 10px; }
    .scratchpad-btn {
      flex: 1; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem;
      font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit;
    }
    .scratchpad-btn.primary { background: #3b82f6; color: white; }
    .scratchpad-btn.primary:hover { background: #2563eb; }
    .scratchpad-btn.secondary { background: #334155; color: #94a3b8; }
    .scratchpad-btn.secondary:hover { background: #475569; color: #e2e8f0; }
    
    .scratchpad-header {
      padding: 12px 16px; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: #64748b; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .scratchpad-count { background: #334155; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
    .clean-btn {
      background: none; border: 1px solid #475569; color: #94a3b8;
      padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; font-family: inherit;
    }
    .clean-btn:hover { border-color: #64748b; color: #e2e8f0; }
    
    .scratchpad-list { flex: 1; overflow-y: auto; padding: 8px; }
    .scratchpad-item { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .scratchpad-item-text { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 8px; line-height: 1.4; }
    .scratchpad-item-time { font-size: 0.7rem; color: #64748b; margin-bottom: 8px; }
    .scratchpad-item-actions { display: flex; gap: 6px; }
    .item-btn {
      padding: 4px 10px; border-radius: 4px; font-size: 0.7rem;
      cursor: pointer; border: 1px solid #334155; background: transparent;
      color: #94a3b8; transition: all 0.15s; font-family: inherit;
    }
    .item-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .item-btn.activate { border-color: #22c55e; color: #22c55e; }
    .item-btn.activate:hover { background: #22c55e; color: white; }
    .item-btn.delete { border-color: #ef4444; color: #ef4444; }
    .item-btn.delete:hover { background: #ef4444; color: white; }
    
    .scratchpad-empty { text-align: center; padding: 40px 20px; color: #64748b; }
    .scratchpad-empty-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }
    
    /* Right Panel - Work */
    .right-panel { display: flex; flex-direction: column; overflow: hidden; padding: 24px; overflow-y: auto; }
    
    /* Message Banner */
    .message-banner {
      display: none; background: #1e293b; border: 1px solid #a855f7;
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .message-banner.show { display: block; }
    .message-banner-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .message-banner-title { font-size: 0.9rem; font-weight: 600; color: #a855f7; }
    .message-banner-dismiss { background: none; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; }
    .message-item { padding: 10px 0; border-bottom: 1px solid #334155; }
    .message-item:last-child { border-bottom: none; }
    .message-from { font-size: 0.8rem; color: #a855f7; font-weight: 600; margin-bottom: 2px; }
    .message-content { font-size: 0.85rem; color: #cbd5e1; }
    .message-time { font-size: 0.7rem; color: #64748b; margin-top: 4px; }
    
    /* Section Box */
    .section-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
    .section-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .section-header:hover { background: rgba(51, 65, 85, 0.3); }
    .section-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.9rem; }
    .section-title .icon { font-size: 1.1rem; }
    .section-badge { background: #3b82f6; color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .section-badge.danger { background: #ef4444; }
    .section-badge.warning { background: #eab308; }
    .section-badge.muted { background: #475569; }
    .section-badge.orange { background: #f97316; }
    .section-badge.purple { background: #a855f7; }
    .section-toggle { color: #64748b; transition: transform 0.2s; }
    .section-toggle.collapsed { transform: rotate(-90deg); }
    
    .section-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #334155; }
    .section-body.collapsed { display: none; }
    
    /* Task Row */
    .task-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #0f172a; border-radius: 8px; transition: all 0.15s; }
    .task-row:hover { background: #1a2744; transform: translateX(4px); }
    
    .task-checkbox {
      width: 22px; height: 22px; border: 2px solid #475569; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
    }
    .task-checkbox:hover { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .task-checkbox.completing { background: #22c55e; border-color: #22c55e; }
    .task-checkbox.completing::after { content: '✓'; color: white; font-size: 0.7rem; font-weight: 700; }
    
    .task-content { flex: 1; min-width: 0; }
    .task-text { font-size: 0.9rem; color: #e2e8f0; }
    .task-meta { display: flex; gap: 8px; margin-top: 4px; }
    .task-tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; background: #334155; color: #94a3b8; }
    .task-tag.due { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .task-tag.overdue { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .task-tag.due-today { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .task-tag.handoff { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    
    .task-remove { background: none; border: none; color: #475569; cursor: pointer; padding: 4px; opacity: 0; transition: all 0.15s; }
    .task-row:hover .task-remove { opacity: 1; }
    .task-remove:hover { color: #ef4444; }
    
    .task-activate {
      background: none; border: 1px solid #3b82f6; color: #3b82f6;
      cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
      opacity: 0; transition: all 0.15s; font-family: inherit;
    }
    .task-row:hover .task-activate { opacity: 1; }
    .task-activate:hover { background: #3b82f6; color: white; }
    
    .task-claim {
      background: none; border: 1px solid #a855f7; color: #a855f7;
      cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
      transition: all 0.15s; font-family: inherit;
    }
    .task-claim:hover { background: #a855f7; color: white; }
    
    /* Sprint Section */
    .sprint-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .progress-bar { flex: 1; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e); border-radius: 4px; transition: width 0.3s; }
    .sprint-stats { font-size: 0.8rem; color: #94a3b8; }
    .sprint-objectives { display: flex; flex-direction: column; gap: 8px; }
    .sprint-objective { padding: 10px 12px; background: #0f172a; border-radius: 6px; }
    .sprint-objective-text { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; }
    .sprint-objective-progress { font-size: 0.75rem; color: #64748b; }
    
    /* Orphans Section */
    .orphan-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0f172a; border-radius: 6px; }
    .orphan-text { flex: 1; font-size: 0.85rem; color: #cbd5e1; }
    .orphan-btn {
      padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
      border: 1px solid #334155; background: transparent; color: #94a3b8; font-family: inherit;
    }
    .orphan-btn:hover { border-color: #64748b; color: #e2e8f0; }
    
    /* Empty State */
    .empty-state { text-align: center; padding: 30px; color: #64748b; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.5; }
    .empty-title { font-size: 0.95rem; color: #94a3b8; margin-bottom: 4px; }
    .empty-subtitle { font-size: 0.8rem; }
    
    /* Clean Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-weight: 600; }
    .modal-close { background: none; border: none; color: #64748b; font-size: 1.5rem; cursor: pointer; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-item { background: #0f172a; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .modal-item-text { font-size: 0.9rem; margin-bottom: 12px; color: #e2e8f0; }
    .modal-item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-btn {
      padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
      border: 1px solid #334155; background: transparent; color: #94a3b8;
      transition: all 0.15s; font-family: inherit;
    }
    .modal-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .modal-btn.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
    .modal-btn.primary:hover { background: #2563eb; }
    .modal-btn.success { border-color: #22c55e; color: #22c55e; }
    .modal-btn.success:hover { background: #22c55e; color: white; }
    .modal-btn.warning { border-color: #eab308; color: #eab308; }
    .modal-btn.warning:hover { background: #eab308; color: #0f172a; }
    .modal-btn.danger { border-color: #ef4444; color: #ef4444; }
    .modal-btn.danger:hover { background: #ef4444; color: white; }
    
    .scratchpad-zero { text-align: center; padding: 40px; }
    .scratchpad-zero-icon { font-size: 4rem; margin-bottom: 16px; }
    .scratchpad-zero-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
    .scratchpad-zero-subtitle { color: #64748b; }
    
    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #22c55e; color: white; padding: 12px 24px;
      border-radius: 8px; font-weight: 500; z-index: 2000; opacity: 0; transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 30px; color: #64748b; }
    .spinner { width: 20px; height: 20px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Responsive */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .left-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">🚀</div>
    <div class="login-title">Helm</div>
    <div class="login-box">
      <label class="login-label">Enter your PIN</label>
      <div class="pin-container">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
      </div>
      <div class="login-error" id="loginError">Invalid PIN</div>
    </div>
  </div>

  <div class="main-app" id="mainApp">
    <div class="header">
      <div class="header-left">
        <div class="header-logo">🚀</div>
        <div class="header-title">Helm</div>
      </div>
      <div class="header-actions">
        <a class="header-btn planning" href="planning.html">📋 Planning</a>
        <a class="header-btn doing" href="doing.html">🎯 Doing</a>
        <button class="header-btn" id="msgBtn" onclick="showMessageBanner()" style="display:none;">💬<span class="msg-badge" id="msgBadge">0</span></button>
        <button class="header-btn" onclick="loadData()">↻</button>
      </div>
    </div>

    <div class="layout">
      <!-- Left: Scratchpad -->
      <div class="left-panel">
        <div class="scratchpad-input">
          <textarea class="scratchpad-textarea" id="scratchInput" placeholder="What's on your mind?"></textarea>
          <div class="scratchpad-actions">
            <button class="scratchpad-btn primary" onclick="addToScratchpad(true)">+ Active</button>
            <button class="scratchpad-btn secondary" onclick="addToScratchpad(false)">Dump</button>
          </div>
        </div>
        <div class="scratchpad-header">
          <span>Scratchpad <span class="scratchpad-count" id="scratchCount">0</span></span>
          <button class="clean-btn" onclick="openCleanModal()">Clean</button>
        </div>
        <div class="scratchpad-list" id="scratchList">
          <div class="loading"><div class="spinner"></div> Loading...</div>
        </div>
      </div>

      <!-- Right: Work -->
      <div class="right-panel">
        <!-- Message Banner -->
        <div class="message-banner" id="messageBanner">
          <div class="message-banner-header">
            <span class="message-banner-title">💬 Messages</span>
            <button class="message-banner-dismiss" onclick="dismissMessages()">✕</button>
          </div>
          <div id="messageList"></div>
        </div>

        <!-- Incoming Section -->
        <div class="section-box" id="incomingSection">
          <div class="section-header" onclick="toggleSection('incoming')">
            <div class="section-title">
              <span class="icon">📥</span>
              <span>Incoming</span>
              <span class="section-badge purple" id="incomingCount">0</span>
            </div>
            <span class="section-toggle collapsed" id="incomingToggle">▼</span>
          </div>
          <div class="section-body collapsed" id="incomingBody"></div>
        </div>

        <!-- Active Section -->
        <div class="section-box">
          <div class="section-header" onclick="toggleSection('active')">
            <div class="section-title">
              <span class="icon">🎯</span>
              <span>Active</span>
              <span class="section-badge" id="activeCount">0</span>
            </div>
            <span class="section-toggle" id="activeToggle">▼</span>
          </div>
          <div class="section-body" id="activeBody">
            <div class="loading"><div class="spinner"></div> Loading...</div>
          </div>
        </div>

        <!-- Due Section -->
        <div class="section-box" id="dueSection">
          <div class="section-header" onclick="toggleSection('due')">
            <div class="section-title">
              <span class="icon">⚠️</span>
              <span>Due</span>
              <span class="section-badge danger" id="dueCount">0</span>
            </div>
            <span class="section-toggle collapsed" id="dueToggle">▼</span>
          </div>
          <div class="section-body collapsed" id="dueBody"></div>
        </div>

        <!-- Sprint Section -->
        <div class="section-box" id="sprintSection">
          <div class="section-header" onclick="toggleSection('sprint')">
            <div class="section-title">
              <span class="icon">🏃</span>
              <span id="sprintName">Sprint</span>
              <span class="section-badge orange" id="sprintDays">-</span>
            </div>
            <span class="section-toggle collapsed" id="sprintToggle">▼</span>
          </div>
          <div class="section-body collapsed" id="sprintBody">
            <div class="sprint-progress">
              <div class="progress-bar"><div class="progress-fill" id="sprintProgress" style="width: 0%"></div></div>
              <span class="sprint-stats" id="sprintStats">0/0</span>
            </div>
            <div class="sprint-objectives" id="sprintObjectives"></div>
            <div id="sprintTasks"></div>
          </div>
        </div>

        <!-- Orphans Section -->
        <div class="section-box" id="orphansSection">
          <div class="section-header" onclick="toggleSection('orphans')">
            <div class="section-title">
              <span class="icon">📦</span>
              <span>Orphans</span>
              <span class="section-badge warning" id="orphansCount">0</span>
            </div>
            <span class="section-toggle collapsed" id="orphansToggle">▼</span>
          </div>
          <div class="section-body collapsed" id="orphansBody">
            <div id="orphansList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Clean Modal -->
  <div class="modal-overlay" id="cleanModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Clean Scratchpad</div>
        <button class="modal-close" onclick="closeCleanModal()">&times;</button>
      </div>
      <div class="modal-body" id="cleanModalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const USER_CONFIG = {
      '1987': { name: 'Micaiah', api: 'https://productivity-mcp-server.micaiah-tasks.workers.dev/api' },
      '1976': { name: 'Irene', api: 'https://productivity-irene.micaiah-tasks.workers.dev/api' }
    };
    let API_URL = '', API_KEY = '';
    let scratchpadItems = [], activeTasks = [], dueTasks = [], sprintTasks = [], orphanTasks = [], incomingTasks = [], messages = [], sprintData = null;

    function checkSession() {
      const s = localStorage.getItem('dashboardSession');
      if (s) {
        const { pin, timestamp } = JSON.parse(s);
        if (Date.now() - timestamp < 7*24*60*60*1000 && USER_CONFIG[pin]) {
          API_KEY = pin; API_URL = USER_CONFIG[pin].api;
          showMainApp();
          return true;
        }
      }
      return false;
    }

    const pinInputs = document.querySelectorAll('.pin-digit');
    pinInputs.forEach((input, i) => {
      input.addEventListener('input', e => {
        if (e.target.value && i < 3) pinInputs[i+1].focus();
        if (i === 3 && e.target.value) attemptLogin();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) pinInputs[i-1].focus();
      });
    });

    function attemptLogin() {
      const pin = Array.from(pinInputs).map(i => i.value).join('');
      if (USER_CONFIG[pin]) {
        API_KEY = pin; API_URL = USER_CONFIG[pin].api;
        localStorage.setItem('dashboardSession', JSON.stringify({ pin, timestamp: Date.now() }));
        showMainApp();
      } else {
        document.getElementById('loginError').classList.add('show');
        pinInputs.forEach(input => { input.classList.add('error'); input.value = ''; });
        pinInputs[0].focus();
        setTimeout(() => {
          document.getElementById('loginError').classList.remove('show');
          pinInputs.forEach(input => input.classList.remove('error'));
        }, 2000);
      }
    }

    function showMainApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.add('visible');
      loadData();
    }

    async function api(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY };
      try {
        const r = await fetch(API_URL + endpoint, { ...options, headers });
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) { console.error(e); return null; }
    }

    async function loadData() {
      await Promise.all([loadScratchpad(), loadMorning(), loadOrphans(), loadMessages()]);
    }

    async function loadMessages() {
      const data = await api('/messages');
      messages = data?.messages || [];
      const msgBtn = document.getElementById('msgBtn');
      const msgBadge = document.getElementById('msgBadge');
      if (messages.length > 0) { msgBtn.style.display = 'flex'; msgBadge.textContent = messages.length; }
      else msgBtn.style.display = 'none';
    }

    function showMessageBanner() {
      if (messages.length === 0) return;
      const banner = document.getElementById('messageBanner');
      document.getElementById('messageList').innerHTML = messages.map(m => `
        <div class="message-item">
          <div class="message-from">${esc(m.from_user)}</div>
          <div class="message-content">${esc(m.content)}</div>
          <div class="message-time">${formatTime(m.created_at)}</div>
        </div>
      `).join('');
      banner.classList.add('show');
    }

    async function dismissMessages() {
      document.getElementById('messageBanner').classList.remove('show');
      await api('/messages/read', { method: 'POST' });
      messages = [];
      document.getElementById('msgBtn').style.display = 'none';
    }

    async function loadScratchpad() {
      const data = await api('/scratchpad');
      scratchpadItems = data?.items || [];
      renderScratchpad();
    }

    function renderScratchpad() {
      document.getElementById('scratchCount').textContent = scratchpadItems.length;
      const list = document.getElementById('scratchList');
      if (scratchpadItems.length === 0) {
        list.innerHTML = '<div class="scratchpad-empty"><div class="scratchpad-empty-icon">✨</div><div>Scratchpad clear</div></div>';
        return;
      }
      list.innerHTML = scratchpadItems.map(item => `
        <div class="scratchpad-item">
          <div class="scratchpad-item-text">${esc(item.text)}</div>
          <div class="scratchpad-item-time">${formatTime(item.created_at)}</div>
          <div class="scratchpad-item-actions">
            <button class="item-btn activate" onclick="processScratchpad('${item.id}', 'activate')">✓ Active</button>
            <button class="item-btn" onclick="processScratchpad('${item.id}', 'task')">→ Task</button>
            <button class="item-btn" onclick="processScratchpad('${item.id}', 'orphan')">→ Orphan</button>
            <button class="item-btn delete" onclick="processScratchpad('${item.id}', 'delete')">🗑</button>
          </div>
        </div>
      `).join('');
    }

    async function addToScratchpad(makeActive) {
      const input = document.getElementById('scratchInput');
      const text = input.value.trim();
      if (!text) return;
      if (makeActive) {
        const r = await api('/tasks', { method: 'POST', body: JSON.stringify({ text, category: 'General', priority: 3 }) });
        if (r?.id) {
          await api(`/tasks/${r.id}/activate`, { method: 'POST' });
          showToast('Task activated');
          input.value = '';
          loadMorning();
        }
      } else {
        const r = await api('/scratchpad', { method: 'POST', body: JSON.stringify({ text }) });
        if (r?.success) { showToast('Added to scratchpad'); input.value = ''; loadScratchpad(); }
      }
    }

    async function processScratchpad(id, action) {
      const r = await api(`/scratchpad/${id}/process`, { method: 'POST', body: JSON.stringify({ action }) });
      if (r?.success) {
        showToast(action === 'activate' ? 'Task activated!' : action === 'task' ? 'Moved to tasks' : action === 'orphan' ? 'Moved to orphans' : 'Deleted');
        loadScratchpad();
        if (action === 'activate') loadMorning();
        if (action === 'orphan') loadOrphans();
      }
    }

    async function loadMorning() {
      const data = await api('/morning');
      if (!data) return;
      activeTasks = data.activeTasks || [];
      sprintTasks = data.sprintTasks || [];
      sprintData = data.sprint;
      incomingTasks = data.incoming || [];
      const today = new Date().toISOString().split('T')[0];
      dueTasks = [...(data.overdueTasks || [])];
      const backlog = data.backlogByCategory || {};
      for (const cat in backlog) {
        for (const task of backlog[cat]) {
          if (task.due_date === today && !task.is_active && !dueTasks.find(t => t.id === task.id)) {
            dueTasks.push(task);
          }
        }
      }
      dueTasks.sort((a, b) => a.due_date < today && b.due_date >= today ? -1 : a.due_date >= today && b.due_date < today ? 1 : a.due_date.localeCompare(b.due_date));
      renderIncoming();
      renderActive();
      renderDue();
      renderSprint();
    }

    function renderIncoming() {
      const section = document.getElementById('incomingSection');
      document.getElementById('incomingCount').textContent = incomingTasks.length;
      if (incomingTasks.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      document.getElementById('incomingBody').innerHTML = incomingTasks.map(t => `
        <div class="task-row">
          <div class="task-checkbox" onclick="completeTask('${t.id}', this)"></div>
          <div class="task-content">
            <div class="task-text">${esc(t.text)}</div>
            <div class="task-meta"><span class="task-tag handoff">from ${esc(t.assigned_by)}</span></div>
          </div>
          <button class="task-claim" onclick="claimTask('${t.id}')">Claim</button>
        </div>
      `).join('');
    }

    function renderActive() {
      document.getElementById('activeCount').textContent = activeTasks.length;
      const body = document.getElementById('activeBody');
      if (activeTasks.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-title">No active tasks</div><div class="empty-subtitle">Add something to scratchpad</div></div>';
        return;
      }
      const today = new Date().toISOString().split('T')[0];
      body.innerHTML = activeTasks.map(t => {
        let dueBadge = '';
        if (t.due_date) {
          if (t.due_date < today) dueBadge = '<span class="task-tag overdue">Overdue</span>';
          else if (t.due_date === today) dueBadge = '<span class="task-tag due-today">Due today</span>';
          else dueBadge = `<span class="task-tag due">${formatDate(t.due_date)}</span>`;
        }
        return `
          <div class="task-row">
            <div class="task-checkbox" onclick="completeTask('${t.id}', this)"></div>
            <div class="task-content">
              <div class="task-text">${esc(t.text)}</div>
              <div class="task-meta">${dueBadge}${t.category ? `<span class="task-tag">${esc(t.category)}</span>` : ''}</div>
            </div>
            <button class="task-remove" onclick="deactivateTask('${t.id}')">✕</button>
          </div>
        `;
      }).join('');
    }

    function renderDue() {
      const section = document.getElementById('dueSection');
      document.getElementById('dueCount').textContent = dueTasks.length;
      if (dueTasks.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dueBody').innerHTML = dueTasks.map(t => `
        <div class="task-row">
          <div class="task-checkbox" onclick="completeTask('${t.id}', this)"></div>
          <div class="task-content">
            <div class="task-text">${esc(t.text)}</div>
            <div class="task-meta"><span class="task-tag ${t.due_date < today ? 'overdue' : 'due-today'}">${t.due_date < today ? 'Overdue' : 'Today'}</span></div>
          </div>
          <button class="task-activate" onclick="activateTask('${t.id}')">Activate</button>
        </div>
      `).join('');
    }

    function renderSprint() {
      const section = document.getElementById('sprintSection');
      if (!sprintData) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      document.getElementById('sprintName').textContent = sprintData.name;
      document.getElementById('sprintDays').textContent = `${sprintData.daysRemaining}d`;
      const objs = sprintData.objectives || [];
      let total = 0, done = 0;
      objs.forEach(o => { total += o.totalTasks || 0; done += o.doneTasks || 0; });
      const pct = total > 0 ? Math.round(done/total*100) : 0;
      document.getElementById('sprintProgress').style.width = pct + '%';
      document.getElementById('sprintStats').textContent = `${done}/${total}`;
      document.getElementById('sprintObjectives').innerHTML = objs.map(o => `
        <div class="sprint-objective">
          <div class="sprint-objective-text">${esc(o.statement)}</div>
          <div class="sprint-objective-progress">${o.doneTasks}/${o.totalTasks}</div>
        </div>
      `).join('');
      const queue = sprintTasks.filter(t => !t.is_active);
      document.getElementById('sprintTasks').innerHTML = queue.length > 0 ? `
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid #334155;">
          <div style="font-size:0.75rem;color:#64748b;margin-bottom:8px;">Queue</div>
          ${queue.map(t => `
            <div class="task-row">
              <div class="task-checkbox" onclick="completeTask('${t.id}', this)"></div>
              <div class="task-content"><div class="task-text">${esc(t.text)}</div></div>
              <button class="task-activate" onclick="activateTask('${t.id}')">Activate</button>
            </div>
          `).join('')}
        </div>
      ` : '';
    }

    async function loadOrphans() {
      const data = await api('/orphans');
      orphanTasks = data?.tasks || [];
      const section = document.getElementById('orphansSection');
      document.getElementById('orphansCount').textContent = orphanTasks.length;
      if (orphanTasks.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      document.getElementById('orphansList').innerHTML = orphanTasks.map(t => `
        <div class="orphan-row">
          <div class="orphan-text">${esc(t.text)}</div>
          <button class="orphan-btn" onclick="activateTask('${t.id}')">Activate</button>
        </div>
      `).join('');
    }

    async function completeTask(id, el) {
      el.classList.add('completing');
      const r = await api(`/tasks/${id}/complete`, { method: 'POST' });
      if (r?.success) { showToast('Completed! 🎉'); setTimeout(loadMorning, 300); }
      else el.classList.remove('completing');
    }

    async function deactivateTask(id) {
      await api(`/tasks/${id}/deactivate`, { method: 'POST' });
      showToast('Removed');
      loadMorning();
    }

    async function activateTask(id) {
      await api(`/tasks/${id}/activate`, { method: 'POST' });
      showToast('Activated');
      loadMorning();
      loadOrphans();
    }

    async function claimTask(id) {
      await api(`/tasks/${id}/claim`, { method: 'POST' });
      showToast('Claimed');
      loadMorning();
    }

    function toggleSection(name) {
      document.getElementById(name + 'Body').classList.toggle('collapsed');
      document.getElementById(name + 'Toggle').classList.toggle('collapsed');
    }

    function openCleanModal() {
      document.getElementById('cleanModal').classList.add('active');
      renderCleanModal();
    }

    function closeCleanModal() {
      document.getElementById('cleanModal').classList.remove('active');
    }

    function renderCleanModal() {
      const body = document.getElementById('cleanModalBody');
      if (scratchpadItems.length === 0) {
        body.innerHTML = '<div class="scratchpad-zero"><div class="scratchpad-zero-icon">🎉</div><div class="scratchpad-zero-title">Scratchpad Zero!</div></div>';
        return;
      }
      body.innerHTML = scratchpadItems.map(item => `
        <div class="modal-item">
          <div class="modal-item-text">${esc(item.text)}</div>
          <div class="modal-item-actions">
            <button class="modal-btn success" onclick="processAndNext('${item.id}', 'activate')">✓ Activate</button>
            <button class="modal-btn" onclick="processAndNext('${item.id}', 'task')">→ Task</button>
            <button class="modal-btn warning" onclick="processAndNext('${item.id}', 'orphan')">→ Orphan</button>
            <button class="modal-btn danger" onclick="processAndNext('${item.id}', 'delete')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function processAndNext(id, action) {
      await processScratchpad(id, action);
      renderCleanModal();
    }

    function formatTime(ts) {
      const d = new Date(ts), now = new Date(), diff = Math.floor((now - d) / 60000);
      if (diff < 1) return 'just now';
      if (diff < 60) return diff + 'm ago';
      if (diff < 1440) return Math.floor(diff/60) + 'h ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.getElementById('scratchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addToScratchpad(false); }
      if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); addToScratchpad(true); }
    });

    document.getElementById('cleanModal').addEventListener('click', e => {
      if (e.target.id === 'cleanModal') closeCleanModal();
    });

    if (!checkSession()) pinInputs[0].focus();
  </script>
</body>
</html>
