<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Focus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    /* Login */
    .login-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .login-screen.hidden { display: none; }
    .login-logo { font-size: 3rem; margin-bottom: 20px; }
    .login-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .login-subtitle { color: #64748b; margin-bottom: 30px; }
    .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; width: 100%; max-width: 320px; }
    .login-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; display: block; text-align: center; }
    .pin-container { display: flex; gap: 10px; justify-content: center; }
    .pin-digit { width: 50px; height: 60px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; font-size: 1.5rem; font-weight: 700; color: #e2e8f0; text-align: center; }
    .pin-digit:focus { outline: none; border-color: #3b82f6; }
    .pin-digit.error { border-color: #ef4444; animation: shake 0.3s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .login-error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; opacity: 0; }
    .login-error.show { opacity: 1; }
    
    /* Main App */
    .main-app { display: none; }
    .main-app.visible { display: block; }
    
    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 1.5rem; }
    .header-title { font-size: 1.1rem; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      padding: 8px 14px; background: transparent; border: 1px solid #334155;
      border-radius: 8px; color: #94a3b8; font-size: 0.8rem; font-weight: 500;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 5px;
      transition: all 0.2s;
    }
    .header-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .header-btn.active { border-color: #3b82f6; color: #3b82f6; }
    
    /* Content */
    .content { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
    
    /* Stats Bar */
    .stats-bar {
      display: flex; justify-content: center; gap: 40px;
      margin-bottom: 40px; padding: 20px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 16px; border: 1px solid #334155;
    }
    .stat-item { text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; color: #22c55e; }
    .stat-value.streak { color: #f97316; }
    .stat-value.pending { color: #3b82f6; }
    .stat-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
    
    /* Active Tasks */
    .section-title {
      font-size: 0.8rem; color: #64748b; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .count {
      background: #3b82f6; color: white; padding: 2px 10px;
      border-radius: 10px; font-size: 0.75rem;
    }
    
    .task-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
    
    .task-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex; align-items: center; gap: 16px;
      transition: all 0.2s;
    }
    .task-card:hover {
      border-color: #475569;
      transform: translateX(4px);
    }
    
    .task-checkbox {
      width: 28px; height: 28px;
      border: 2px solid #475569;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .task-checkbox:hover { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .task-checkbox.completing {
      background: #22c55e; border-color: #22c55e;
      animation: pulse 0.3s;
    }
    .task-checkbox.completing::after { content: '✓'; color: white; font-weight: 700; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    
    .task-content { flex: 1; }
    .task-text { font-size: 1rem; color: #f1f5f9; line-height: 1.4; }
    .task-meta { display: flex; gap: 10px; margin-top: 6px; }
    .task-tag {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 4px;
      background: #334155; color: #94a3b8;
    }
    .task-tag.due { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .task-tag.overdue { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .task-tag.sprint { background: rgba(249, 115, 22, 0.2); color: #f97316; }
    
    .task-priority {
      width: 4px; height: 40px; border-radius: 2px;
      background: #475569; flex-shrink: 0;
    }
    .task-priority.high { background: #ef4444; }
    .task-priority.medium { background: #eab308; }
    .task-priority.low { background: #22c55e; }
    
    /* Empty State */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: #64748b;
    }
    .empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.5; }
    .empty-title { font-size: 1.2rem; color: #94a3b8; margin-bottom: 8px; }
    .empty-subtitle { font-size: 0.9rem; }
    
    /* Sprint Section */
    .sprint-section {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
    }
    .sprint-header {
      padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sprint-header:hover { background: rgba(51, 65, 85, 0.3); }
    .sprint-title { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .sprint-toggle {
      color: #64748b; font-size: 1.2rem;
      transition: transform 0.2s;
    }
    .sprint-toggle.open { transform: rotate(180deg); }
    .sprint-progress {
      display: flex; align-items: center; gap: 12px;
      font-size: 0.85rem; color: #94a3b8;
    }
    .progress-bar {
      width: 100px; height: 6px;
      background: #334155; border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e);
      border-radius: 3px; transition: width 0.3s;
    }
    .sprint-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    .sprint-body.open { max-height: 1000px; }
    .sprint-content { padding: 0 20px 20px; }
    .sprint-stats {
      display: flex; gap: 20px; margin-bottom: 16px;
      padding: 12px 16px; background: #0f172a; border-radius: 8px;
    }
    .sprint-stat { font-size: 0.85rem; color: #94a3b8; }
    .sprint-stat strong { color: #e2e8f0; }
    
    .sprint-tasks { display: flex; flex-direction: column; gap: 8px; }
    .sprint-task {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: #0f172a; border-radius: 8px;
      font-size: 0.9rem;
    }
    .sprint-task-status {
      width: 8px; height: 8px; border-radius: 50%;
      background: #475569;
    }
    .sprint-task-status.done { background: #22c55e; }
    .sprint-task-status.active { background: #3b82f6; }
    .sprint-task-text { flex: 1; color: #cbd5e1; }
    .sprint-task-text.done { color: #64748b; text-decoration: line-through; }
    
    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #22c55e; color: white; padding: 14px 28px;
      border-radius: 10px; font-weight: 600; z-index: 1000;
      opacity: 0; transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    
    /* Celebration */
    .celebration {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 5rem; z-index: 1000; pointer-events: none;
      opacity: 0; animation: celebrate 1s ease-out forwards;
    }
    @keyframes celebrate {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }
    
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #64748b; }
    .spinner { width: 24px; height: 24px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">🎯</div>
    <div class="login-title">Focus</div>
    <div class="login-subtitle">Deep work mode</div>
    <div class="login-box">
      <label class="login-label">Enter your PIN</label>
      <div class="pin-container">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
      </div>
      <div class="login-error" id="loginError">Invalid PIN</div>
    </div>
  </div>

  <div class="main-app" id="mainApp">
    <div class="header">
      <div class="header-left">
        <div class="header-logo">🎯</div>
        <div class="header-title">Focus</div>
      </div>
      <div class="header-actions">
        <a class="header-btn" href="index.html">⚙️ Helm</a>
        <a class="header-btn" href="projects.html">📁 Projects</a>
        <button class="header-btn" onclick="window.open('https://claude.ai', '_blank')">✨ Claude</button>
        <button class="header-btn" onclick="loadData()">↻</button>
      </div>
    </div>

    <div class="content">
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value" id="completedToday">0</div>
          <div class="stat-label">Done Today</div>
        </div>
        <div class="stat-item">
          <div class="stat-value streak" id="streakDays">0</div>
          <div class="stat-label">Day Streak</div>
        </div>
        <div class="stat-item">
          <div class="stat-value pending" id="activeCount">0</div>
          <div class="stat-label">In Focus</div>
        </div>
      </div>

      <div class="section-title">
        Active Tasks <span class="count" id="taskCount">0</span>
      </div>
      <div class="task-list" id="taskList">
        <div class="loading"><div class="spinner"></div> Loading...</div>
      </div>

      <div class="sprint-section" id="sprintSection" style="display: none;">
        <div class="sprint-header" onclick="toggleSprint()">
          <div class="sprint-title">
            <span>🏃</span>
            <span id="sprintName">Sprint</span>
          </div>
          <div class="sprint-progress">
            <div class="progress-bar">
              <div class="progress-fill" id="sprintProgress" style="width: 0%"></div>
            </div>
            <span id="sprintPercent">0%</span>
            <span class="sprint-toggle" id="sprintToggle">▼</span>
          </div>
        </div>
        <div class="sprint-body" id="sprintBody">
          <div class="sprint-content">
            <div class="sprint-stats">
              <div class="sprint-stat"><strong id="sprintDone">0</strong> / <span id="sprintTotal">0</span> tasks</div>
              <div class="sprint-stat"><strong id="sprintDays">0</strong> days left</div>
            </div>
            <div class="sprint-tasks" id="sprintTasks"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const USER_CONFIG = {
      '1987': { name: 'Micaiah', api: 'https://productivity-mcp-server.micaiah-tasks.workers.dev/api' },
      '1976': { name: 'Irene', api: 'https://productivity-irene.micaiah-tasks.workers.dev/api' }
    };
    let API_URL = '', API_KEY = '';
    let completedToday = 0;

    // Login
    function checkSession() {
      const s = localStorage.getItem('dashboardSession');
      if (s) {
        const { pin, timestamp } = JSON.parse(s);
        if (Date.now() - timestamp < 7*24*60*60*1000 && USER_CONFIG[pin]) {
          API_KEY = pin;
          API_URL = USER_CONFIG[pin].api;
          showMainApp();
          return true;
        }
      }
      return false;
    }

    const pinInputs = document.querySelectorAll('.pin-digit');
    pinInputs.forEach((input, i) => {
      input.addEventListener('input', e => {
        if (e.target.value && i < 3) pinInputs[i+1].focus();
        if (i === 3 && e.target.value) attemptLogin();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) pinInputs[i-1].focus();
      });
    });

    function attemptLogin() {
      const pin = Array.from(pinInputs).map(i => i.value).join('');
      if (USER_CONFIG[pin]) {
        API_KEY = pin;
        API_URL = USER_CONFIG[pin].api;
        localStorage.setItem('dashboardSession', JSON.stringify({ pin, timestamp: Date.now() }));
        showMainApp();
      } else {
        document.getElementById('loginError').classList.add('show');
        pinInputs.forEach(input => { input.classList.add('error'); input.value = ''; });
        pinInputs[0].focus();
        setTimeout(() => {
          document.getElementById('loginError').classList.remove('show');
          pinInputs.forEach(input => input.classList.remove('error'));
        }, 2000);
      }
    }

    function showMainApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.add('visible');
      loadData();
    }

    // API
    async function api(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY };
      try {
        const r = await fetch(API_URL + endpoint, { ...options, headers });
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    // Load Data
    async function loadData() {
      const data = await api('/morning');
      if (!data) return;

      const active = data.activeTasks || [];
      document.getElementById('activeCount').textContent = active.length;
      document.getElementById('taskCount').textContent = active.length;

      // Calculate completed today (from stats if available)
      const today = new Date().toISOString().split('T')[0];
      completedToday = data.completedToday || 0;
      document.getElementById('completedToday').textContent = completedToday;

      // Streak (placeholder - would need backend support)
      const streak = localStorage.getItem('focusStreak') || '1';
      document.getElementById('streakDays').textContent = streak;

      // Render active tasks
      const taskList = document.getElementById('taskList');
      if (active.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎉</div>
            <div class="empty-title">All clear!</div>
            <div class="empty-subtitle">No active tasks. Time to activate some from Helm.</div>
          </div>
        `;
      } else {
        taskList.innerHTML = active.map(t => renderTask(t)).join('');
      }

      // Sprint section
      if (data.sprint) {
        document.getElementById('sprintSection').style.display = 'block';
        document.getElementById('sprintName').textContent = data.sprint.name;
        document.getElementById('sprintDays').textContent = data.sprint.daysRemaining;

        const objs = data.sprint.objectives || [];
        let total = 0, done = 0;
        objs.forEach(o => { total += o.totalTasks || 0; done += o.doneTasks || 0; });
        const pct = total > 0 ? Math.round(done/total*100) : 0;

        document.getElementById('sprintProgress').style.width = pct + '%';
        document.getElementById('sprintPercent').textContent = pct + '%';
        document.getElementById('sprintDone').textContent = done;
        document.getElementById('sprintTotal').textContent = total;

        // Sprint tasks (all sprint tasks, not just active)
        const sprintTasks = data.sprintTasks || [];
        document.getElementById('sprintTasks').innerHTML = sprintTasks.map(t => `
          <div class="sprint-task">
            <div class="sprint-task-status ${t.status === 'done' ? 'done' : t.is_active ? 'active' : ''}"></div>
            <div class="sprint-task-text ${t.status === 'done' ? 'done' : ''}">${esc(t.text)}</div>
          </div>
        `).join('') || '<div class="sprint-task"><div class="sprint-task-text">No sprint tasks</div></div>';
      } else {
        document.getElementById('sprintSection').style.display = 'none';
      }
    }

    function renderTask(task) {
      const isOverdue = task.due_date && new Date(task.due_date) < new Date(new Date().toDateString());
      let priorityClass = 'medium';
      if (task.priority <= 2) priorityClass = 'high';
      else if (task.priority >= 4) priorityClass = 'low';

      let meta = '';
      if (task.due_date) {
        meta += `<span class="task-tag ${isOverdue ? 'overdue' : 'due'}">${fmtDate(task.due_date)}</span>`;
      }
      if (task.objective_statement) {
        meta += `<span class="task-tag sprint">${esc(task.objective_statement)}</span>`;
      }
      if (task.category) {
        meta += `<span class="task-tag">${esc(task.category)}</span>`;
      }

      return `
        <div class="task-card" data-id="${task.id}">
          <div class="task-priority ${priorityClass}"></div>
          <div class="task-checkbox" onclick="completeTask('${task.id}', this)"></div>
          <div class="task-content">
            <div class="task-text">${esc(task.text)}</div>
            ${meta ? `<div class="task-meta">${meta}</div>` : ''}
          </div>
        </div>
      `;
    }

    async function completeTask(id, checkbox) {
      checkbox.classList.add('completing');
      const r = await api('/tasks/' + id + '/complete', { method: 'POST' });
      if (r && r.success) {
        completedToday++;
        document.getElementById('completedToday').textContent = completedToday;
        
        // Celebration
        showCelebration();
        showToast('Task completed! 🎉');
        
        setTimeout(() => {
          const card = checkbox.closest('.task-card');
          card.style.opacity = '0';
          card.style.transform = 'translateX(100px)';
          setTimeout(() => loadData(), 300);
        }, 500);
      } else {
        checkbox.classList.remove('completing');
      }
    }

    function showCelebration() {
      const emojis = ['🎉', '⭐', '🔥', '💪', '✨', '🚀'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      const el = document.createElement('div');
      el.className = 'celebration';
      el.textContent = emoji;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function toggleSprint() {
      const body = document.getElementById('sprintBody');
      const toggle = document.getElementById('sprintToggle');
      body.classList.toggle('open');
      toggle.classList.toggle('open');
    }

    function fmtDate(d) {
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function esc(s) {
      return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Init
    if (!checkSession()) pinInputs[0].focus();
  </script>
</body>
</html>
