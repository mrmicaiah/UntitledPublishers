<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Helm - Bots Overview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue-700: #1d4ed8; --blue-600: #2563eb; --blue-500: #3b82f6; --blue-400: #60a5fa; --blue-100: #dbeafe; --blue-50: #eff6ff;
      --gray-900: #111827; --gray-800: #1f2937; --gray-700: #374151; --gray-600: #4b5563; --gray-500: #6b7280; --gray-400: #9ca3af; 
      --gray-300: #d1d5db; --gray-200: #e5e7eb; --gray-100: #f3f4f6; --gray-50: #f9fafb; --white: #ffffff;
      --green-700: #15803d; --green-600: #16a34a; --green-500: #22c55e; --green-100: #dcfce7;
      --red-700: #b91c1c; --red-600: #dc2626; --red-500: #ef4444; --red-100: #fee2e2;
      --yellow-600: #ca8a04; --yellow-500: #eab308; --yellow-100: #fef9c3;
      --purple-700: #7e22ce; --purple-600: #9333ea; --purple-100: #f3e8ff;
      --orange-600: #ea580c; --orange-500: #f97316; --orange-100: #ffedd5;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.08);
      --shadow: 0 2px 4px 0 rgb(0 0 0 / 0.12);
      --shadow-md: 0 4px 8px -1px rgb(0 0 0 / 0.15), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-200); color: var(--gray-900); line-height: 1.5; min-height: 100vh; }
    
    .login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, var(--blue-100) 0%, var(--gray-200) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .login-screen.hidden { display: none; }
    .login-logo { width: 72px; height: 72px; background: var(--blue-600); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin-bottom: 24px; box-shadow: var(--shadow-md); border: 2px solid var(--blue-700); }
    .login-title { font-size: 2rem; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
    .login-subtitle { font-size: 1rem; color: var(--gray-600); margin-bottom: 32px; }
    .login-box { background: var(--white); border: 2px solid var(--gray-400); border-radius: 16px; padding: 32px 40px; width: 100%; max-width: 380px; box-shadow: var(--shadow-md); }
    .login-label { font-size: 0.9rem; color: var(--gray-600); margin-bottom: 16px; display: block; text-align: center; font-weight: 500; }
    .pin-input-container { display: flex; gap: 12px; justify-content: center; margin-bottom: 8px; }
    .pin-digit { width: 58px; height: 68px; background: var(--white); border: 2px solid var(--gray-500); border-radius: 12px; font-size: 1.6rem; font-weight: 700; color: var(--gray-900); text-align: center; }
    .pin-digit:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 3px var(--blue-100); }
    .pin-digit.error { border-color: var(--red-500); animation: shake 0.3s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .login-error { color: var(--red-600); font-size: 0.9rem; font-weight: 500; text-align: center; margin-top: 16px; opacity: 0; transition: opacity 0.2s; }
    .login-error.show { opacity: 1; }
    
    .main-app { display: none; } .main-app.visible { display: block; }
    
    .header-bar { background: var(--white); border-bottom: 2px solid var(--gray-400); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 40px; height: 40px; background: var(--purple-600); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: var(--shadow-sm); border: 2px solid var(--purple-700); }
    .header-title { font-size: 1.15rem; font-weight: 700; color: var(--gray-900); }
    .header-title span { font-weight: 500; color: var(--gray-500); font-size: 0.9rem; margin-left: 8px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .header-btn { padding: 8px 14px; background: var(--white); border: 2px solid var(--gray-500); border-radius: 8px; color: var(--gray-700); font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: inherit; transition: all 0.15s; text-decoration: none; }
    .header-btn:hover { background: var(--gray-100); border-color: var(--gray-600); }
    .header-btn.active { border-color: var(--purple-600); color: var(--purple-700); background: var(--purple-100); }
    
    .content { padding: 24px; max-width: 1200px; margin: 0 auto; }
    
    .page-title { font-size: 1.5rem; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .page-subtitle { font-size: 0.95rem; color: var(--gray-600); margin-bottom: 24px; }
    
    .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
    
    .bot-card { background: var(--white); border: 2px solid var(--gray-400); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); transition: all 0.15s; }
    .bot-card:hover { border-color: var(--gray-500); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .bot-card.online { border-left: 5px solid var(--green-500); }
    .bot-card.offline { border-left: 5px solid var(--red-500); }
    .bot-card.unknown { border-left: 5px solid var(--yellow-500); }
    .bot-card.standalone { border: 2px dashed var(--gray-400); background: var(--gray-50); }
    .bot-card.standalone:hover { border-color: var(--gray-500); }
    
    .bot-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .bot-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; border: 2px solid; }
    .bot-icon.mcp { background: var(--blue-100); border-color: var(--blue-400); }
    .bot-icon.blog { background: var(--green-100); border-color: var(--green-500); }
    .bot-icon.email { background: var(--purple-100); border-color: var(--purple-400); }
    .bot-icon.seo { background: var(--orange-100); border-color: var(--orange-400); }
    
    .bot-title { font-size: 1.05rem; font-weight: 700; color: var(--gray-900); }
    .bot-status { font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
    .bot-status.online { background: var(--green-100); color: var(--green-700); }
    .bot-status.offline { background: var(--red-100); color: var(--red-700); }
    .bot-status.unknown { background: var(--yellow-100); color: var(--yellow-600); }
    .bot-status.standalone { background: var(--gray-200); color: var(--gray-600); }
    
    .bot-desc { font-size: 0.9rem; color: var(--gray-600); margin-bottom: 16px; line-height: 1.5; }
    
    .bot-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .bot-tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; background: var(--gray-100); color: var(--gray-700); font-weight: 600; border: 1px solid var(--gray-300); }
    .bot-tag.kv { background: var(--blue-50); color: var(--blue-700); border-color: var(--blue-200); }
    .bot-tag.d1 { background: var(--purple-100); color: var(--purple-700); border-color: var(--purple-300); }
    
    .bot-url { font-size: 0.8rem; color: var(--gray-500); font-family: monospace; word-break: break-all; padding: 10px; background: var(--gray-100); border-radius: 6px; border: 1px solid var(--gray-300); }
    
    .bot-connections { margin-top: 16px; padding-top: 16px; border-top: 2px solid var(--gray-200); }
    .bot-connections-title { font-size: 0.8rem; font-weight: 700; color: var(--gray-700); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .connection-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .connection-item { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; background: var(--white); border: 2px solid var(--gray-300); color: var(--gray-600); font-weight: 500; }
    
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; margin-top: 32px; padding-bottom: 10px; border-bottom: 2px solid var(--gray-400); }
    .section-header:first-child { margin-top: 0; }
    .section-title { font-size: 1rem; font-weight: 700; color: var(--gray-800); text-transform: uppercase; letter-spacing: 0.5px; }
    .section-count { font-size: 0.8rem; color: var(--blue-700); font-weight: 700; background: var(--blue-100); padding: 3px 12px; border-radius: 12px; border: 2px solid var(--blue-400); }
    
    .section-header.up { border-color: var(--blue-400); }
    .section-header.up .section-title { color: var(--blue-700); }
    .section-header.client { border-color: var(--green-400); }
    .section-header.client .section-title { color: var(--green-700); }
    .section-header.standalone { border-color: var(--gray-400); }
    .section-header.standalone .section-title { color: var(--gray-600); }
    
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--gray-900); color: white; padding: 14px 28px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; z-index: 1000; opacity: 0; transition: opacity 0.3s; box-shadow: var(--shadow-md); }
    .toast.show { opacity: 1; }
    
    @media (max-width: 600px) { .bot-grid { grid-template-columns: 1fr; } .content { padding: 16px; } .header-actions { gap: 4px; } .header-btn { padding: 6px 10px; font-size: 0.75rem; } }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">🤖</div>
    <div class="login-title">Helm</div>
    <div class="login-subtitle">Bots Overview</div>
    <div class="login-box">
      <label class="login-label">Enter your PIN</label>
      <div class="pin-input-container">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
      </div>
      <div class="login-error" id="loginError">Invalid PIN</div>
    </div>
  </div>

  <div class="main-app" id="mainApp">
    <div class="header-bar">
      <div class="header-left">
        <div class="header-logo">🤖</div>
        <div>
          <div class="header-title">Helm <span>Bots</span></div>
        </div>
      </div>
      <div class="header-actions">
        <a href="/dashboard/" class="header-btn">📋 Tasks</a>
        <a href="/emailbot/" class="header-btn">📧 Courier</a>
        <a href="/dashboard/bots.html" class="header-btn active">🤖 Bots</a>
        <button class="header-btn" onclick="checkAllBots()">↻ Check All</button>
        <button class="header-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="content">
      <h1 class="page-title">🤖 Bots Overview</h1>
      <p class="page-subtitle">All Cloudflare Workers powering Untitled Publishers infrastructure</p>

      <!-- UP Workers -->
      <div class="section-header up">
        <span class="section-title">🏢 Untitled Publishers Workers</span>
      </div>
      <div class="bot-grid" id="upBots"></div>

      <!-- Client Workers -->
      <div class="section-header client">
        <span class="section-title">👥 Client Workers</span>
      </div>
      <div class="bot-grid" id="clientBots"></div>

      <!-- Standalone / Legacy -->
      <div class="section-header standalone">
        <span class="section-title">📦 Standalone (Client-Specific)</span>
      </div>
      <div class="bot-grid" id="standaloneBots"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const USER_CONFIG = {
      '1987': { name: 'Micaiah' },
      '1976': { name: 'Irene' }
    };

    // UP Workers - Untitled Publishers infrastructure
    const UP_BOTS = [
      {
        name: 'Productivity MCP (Micaiah)',
        icon: '⚙️',
        iconClass: 'mcp',
        url: 'https://productivity-mcp-server.micaiah-tasks.workers.dev',
        description: 'Main productivity hub with 70+ tools - tasks, sprints, Google Drive, Gmail, GitHub, Blogger, Courier email marketing, journaling, launch tracking',
        storage: ['D1: productivity-brain'],
        connections: ['Google Drive', 'Gmail (personal)', 'Gmail (company)', 'GitHub', 'Blogger', 'Contacts']
      },
      {
        name: 'Productivity MCP (Irene)',
        icon: '⚙️',
        iconClass: 'mcp',
        url: 'https://productivity-irene.micaiah-tasks.workers.dev',
        description: 'Irene\'s productivity instance - same codebase, separate OAuth tokens, shared database',
        storage: ['D1: productivity-brain (shared)'],
        connections: ['Google Drive', 'Gmail', 'GitHub']
      },
      {
        name: 'Courier Email Platform',
        icon: '📧',
        iconClass: 'email',
        url: 'https://email-bot-server.micaiah-tasks.workers.dev',
        description: 'Full email marketing platform - lists, subscribers, templates, sequences, campaigns, tracking. Replaces Beehiiv.',
        storage: ['D1: email-bot-db'],
        connections: ['Resend API']
      },
      {
        name: 'SEO Scout',
        icon: '🔍',
        iconClass: 'seo',
        url: 'https://seo-scout.micaiah-tasks.workers.dev',
        description: 'SEO research MCP - keyword discovery, competition analysis, difficulty scores, long-tail finder',
        storage: [],
        connections: ['DataForSEO API']
      },
      {
        name: 'UP Blogs',
        icon: '📝',
        iconClass: 'blog',
        url: 'https://up-blogs-1.micaiah-tasks.workers.dev',
        description: 'Multi-tenant blog API for UP properties. API key auth, Claude-driven - no admin UI needed.',
        storage: ['KV: up-blogs'],
        connections: ['GitHub (push)', 'Courier (email)'],
        blogs: ['Ready for: micaiah-bussey']
      }
    ];

    // Client Workers - for external clients
    const CLIENT_BOTS = [
      {
        name: 'Client Blogs',
        icon: '📝',
        iconClass: 'blog',
        url: 'https://client-blogs-1.micaiah-tasks.workers.dev',
        description: 'Multi-tenant blog admin for client websites. Password auth with admin dashboard.',
        storage: ['KV: client-blogs'],
        connections: ['GitHub (push)', 'Courier (email)'],
        blogs: ['Ready for new clients']
      }
    ];

    // Standalone - client-specific legacy workers
    const STANDALONE_BOTS = [
      {
        name: 'Denny Blog Admin',
        icon: '🏠',
        iconClass: 'blog',
        url: 'https://denny-blog-admin.micaiah-tasks.workers.dev',
        description: 'Standalone blog worker for builtbydenny.com. Single-tenant, runs independently.',
        storage: ['KV: denny-blog'],
        connections: ['GitHub: mrmicaiah/built-by-denny'],
        standalone: true,
        client: 'Denny Liuzzo'
      }
    ];

    let currentUser = '';

    function checkSession() {
      const s = localStorage.getItem('dashboardSession');
      if (s) {
        const { pin, timestamp } = JSON.parse(s);
        if (Date.now() - timestamp < 7*24*60*60*1000 && USER_CONFIG[pin]) {
          currentUser = USER_CONFIG[pin].name;
          showMainApp();
          return true;
        }
      }
      return false;
    }

    const pinInputs = document.querySelectorAll('.pin-digit');
    pinInputs.forEach((input, i) => {
      input.addEventListener('input', e => {
        if (e.target.value && i < 3) pinInputs[i+1].focus();
        if (i === 3 && e.target.value) attemptLogin();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) pinInputs[i-1].focus();
      });
    });

    function attemptLogin() {
      const pin = Array.from(pinInputs).map(i => i.value).join('');
      if (USER_CONFIG[pin]) {
        currentUser = USER_CONFIG[pin].name;
        localStorage.setItem('dashboardSession', JSON.stringify({ pin, timestamp: Date.now() }));
        showMainApp();
      } else {
        document.getElementById('loginError').classList.add('show');
        pinInputs.forEach(input => { input.classList.add('error'); input.value = ''; });
        pinInputs[0].focus();
        setTimeout(() => {
          document.getElementById('loginError').classList.remove('show');
          pinInputs.forEach(input => input.classList.remove('error'));
        }, 2000);
      }
    }

    function showMainApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.add('visible');
      renderBots();
      checkAllBots();
    }

    function logout() {
      localStorage.removeItem('dashboardSession');
      location.reload();
    }

    function renderBots() {
      document.getElementById('upBots').innerHTML = UP_BOTS.map(renderBotCard).join('');
      document.getElementById('clientBots').innerHTML = CLIENT_BOTS.map(renderBotCard).join('');
      document.getElementById('standaloneBots').innerHTML = STANDALONE_BOTS.map(renderBotCard).join('');
    }

    function renderBotCard(bot) {
      const storageHtml = bot.storage.map(s => {
        const isKv = s.toLowerCase().includes('kv');
        return `<span class="bot-tag ${isKv ? 'kv' : 'd1'}">${esc(s)}</span>`;
      }).join('');

      const connectionsHtml = bot.connections.length > 0 ? `
        <div class="bot-connections">
          <div class="bot-connections-title">Connections</div>
          <div class="connection-list">
            ${bot.connections.map(c => `<span class="connection-item">${esc(c)}</span>`).join('')}
          </div>
        </div>
      ` : '';

      const blogsHtml = bot.blogs ? `
        <div class="bot-connections">
          <div class="bot-connections-title">Blogs</div>
          <div class="connection-list">
            ${bot.blogs.map(b => `<span class="connection-item">${esc(b)}</span>`).join('')}
          </div>
        </div>
      ` : '';

      const clientHtml = bot.client ? `
        <div class="bot-connections">
          <div class="bot-connections-title">Client</div>
          <div class="connection-list">
            <span class="connection-item">${esc(bot.client)}</span>
          </div>
        </div>
      ` : '';

      const cardClass = bot.standalone ? 'bot-card standalone unknown' : 'bot-card unknown';

      return `
        <div class="${cardClass}" id="bot-${slugify(bot.name)}">
          <div class="bot-header">
            <div class="bot-icon ${bot.iconClass}">${bot.icon}</div>
            <div>
              <div class="bot-title">${esc(bot.name)}</div>
              <span class="bot-status ${bot.standalone ? 'standalone' : 'unknown'}" id="status-${slugify(bot.name)}">${bot.standalone ? 'Standalone' : 'Checking...'}</span>
            </div>
          </div>
          <div class="bot-desc">${esc(bot.description)}</div>
          <div class="bot-meta">${storageHtml}</div>
          <div class="bot-url">${esc(bot.url)}</div>
          ${connectionsHtml}
          ${blogsHtml}
          ${clientHtml}
        </div>
      `;
    }

    async function checkAllBots() {
      showToast('Checking bot status...');
      const allBots = [...UP_BOTS, ...CLIENT_BOTS, ...STANDALONE_BOTS];
      for (const bot of allBots) {
        checkBot(bot);
      }
    }

    async function checkBot(bot) {
      const slug = slugify(bot.name);
      const card = document.getElementById(`bot-${slug}`);
      const status = document.getElementById(`status-${slug}`);
      
      // Skip status check for standalone bots - they keep their "Standalone" label
      if (bot.standalone) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 5000);
          const response = await fetch(bot.url + '/health', { signal: controller.signal }).catch(() => fetch(bot.url, { signal: controller.signal }));
          clearTimeout(timeout);
          if (response.ok) {
            card.classList.remove('offline');
            card.classList.add('online');
          } else {
            card.classList.remove('online');
            card.classList.add('offline');
          }
        } catch (e) {
          card.classList.remove('online');
          card.classList.add('offline');
        }
        return;
      }
      
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        
        const response = await fetch(bot.url + '/health', {
          method: 'GET',
          signal: controller.signal
        }).catch(() => fetch(bot.url, { signal: controller.signal }));
        
        clearTimeout(timeout);
        
        if (response.ok) {
          card.classList.remove('unknown', 'offline');
          card.classList.add('online');
          status.classList.remove('unknown', 'offline');
          status.classList.add('online');
          status.textContent = 'Online';
        } else {
          throw new Error('Not OK');
        }
      } catch (e) {
        card.classList.remove('unknown', 'online');
        card.classList.add('offline');
        status.classList.remove('unknown', 'online');
        status.classList.add('offline');
        status.textContent = 'Offline';
      }
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function esc(s) {
      return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    if (!checkSession()) pinInputs[0].focus();
  </script>
</body>
</html>
