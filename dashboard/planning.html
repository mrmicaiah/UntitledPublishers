<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    /* Login */
    .login-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-screen.hidden { display: none; }
    .login-logo { font-size: 3rem; margin-bottom: 20px; }
    .login-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 30px; }
    .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; }
    .login-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; display: block; text-align: center; }
    .pin-container { display: flex; gap: 10px; justify-content: center; }
    .pin-digit { width: 50px; height: 60px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; font-size: 1.5rem; font-weight: 700; color: #e2e8f0; text-align: center; }
    .pin-digit:focus { outline: none; border-color: #3b82f6; }
    .pin-digit.error { border-color: #ef4444; animation: shake 0.3s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .login-error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; opacity: 0; }
    .login-error.show { opacity: 1; }
    
    /* Main App */
    .main-app { display: none; height: 100vh; flex-direction: column; }
    .main-app.visible { display: flex; }
    
    /* ========== SHARED NAV BAR ========== */
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      position: relative;
    }
    .nav-brand { display: flex; align-items: center; gap: 8px; }
    .nav-logo { font-size: 1.2rem; }
    .nav-title { font-size: 0.95rem; font-weight: 600; }
    
    .nav-links { display: flex; align-items: center; gap: 6px; }
    .nav-link {
      padding: 6px 10px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; font-size: 0.75rem;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px;
      transition: all 0.2s; font-family: inherit; white-space: nowrap;
    }
    .nav-link:hover { border-color: #64748b; color: #e2e8f0; }
    .nav-link.active { background: #334155; color: #e2e8f0; border-color: #475569; }
    .nav-link.claude { border-color: #f97316; color: #f97316; }
    .nav-link.claude:hover { background: #f97316; color: white; }
    .nav-link.helm { border-color: #f97316; color: #f97316; }
    .nav-link.helm:hover { background: #f97316; color: white; }
    .nav-link.projects { border-color: #14b8a6; color: #14b8a6; }
    .nav-link.projects:hover { background: #14b8a6; color: white; }
    .nav-link.planning { border-color: #3b82f6; color: #3b82f6; }
    .nav-link.planning:hover { background: #3b82f6; color: white; }
    .nav-link.doing { border-color: #22c55e; color: #22c55e; }
    .nav-link.doing:hover { background: #22c55e; color: white; }
    .nav-link.courier { border-color: #a855f7; color: #a855f7; }
    .nav-link.courier:hover { background: #a855f7; color: white; }
    .nav-link.messages { border-color: #a855f7; color: #a855f7; }
    .nav-link.messages:hover { background: #a855f7; color: white; }
    
    .nav-badge { background: #ef4444; color: white; font-size: 0.6rem; padding: 1px 5px; border-radius: 8px; margin-left: 3px; }
    
    .nav-toggle {
      padding: 6px 10px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; gap: 4px; font-family: inherit;
    }
    .nav-toggle:hover { border-color: #64748b; color: #e2e8f0; }
    .nav-toggle.on { border-color: #22c55e; color: #22c55e; }
    .nav-toggle.off { border-color: #64748b; color: #64748b; }
    
    .nav-icon-btn {
      padding: 6px 8px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-icon-btn:hover { border-color: #64748b; color: #e2e8f0; }
    
    .nav-hamburger {
      display: none; padding: 8px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 1.2rem;
    }
    .nav-hamburger:hover { border-color: #64748b; color: #e2e8f0; }
    
    .nav-mobile {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      background: #1e293b; border-bottom: 1px solid #334155;
      padding: 12px; z-index: 100; flex-direction: column; gap: 8px;
    }
    .nav-mobile.open { display: flex; }
    .nav-mobile .nav-link { justify-content: center; padding: 10px; }
    
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
    }
    /* ========== END SHARED NAV BAR ========== */
    
    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      overflow: hidden;
    }
    
    /* Left Panel - Scratchpad */
    .left-panel {
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .scratchpad-input { padding: 16px; border-bottom: 1px solid #334155; }
    .scratchpad-textarea {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; padding: 12px; color: #e2e8f0;
      font-family: inherit; font-size: 0.9rem; resize: none; min-height: 80px;
    }
    .scratchpad-textarea:focus { outline: none; border-color: #3b82f6; }
    .scratchpad-textarea::placeholder { color: #64748b; }
    .scratchpad-actions { display: flex; gap: 8px; margin-top: 10px; }
    .scratchpad-btn {
      flex: 1; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem;
      font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit;
    }
    .scratchpad-btn.primary { background: #3b82f6; color: white; }
    .scratchpad-btn.primary:hover { background: #2563eb; }
    .scratchpad-btn.secondary { background: #334155; color: #94a3b8; }
    .scratchpad-btn.secondary:hover { background: #475569; color: #e2e8f0; }
    
    .scratchpad-header {
      padding: 12px 16px; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: #64748b; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .scratchpad-count { background: #334155; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
    
    .scratchpad-list { flex: 1; overflow-y: auto; }
    .scratch-item {
      padding: 12px 16px; border-bottom: 1px solid #334155;
      transition: background 0.15s;
    }
    .scratch-item:hover { background: rgba(51, 65, 85, 0.3); }
    .scratch-item-text { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 8px; line-height: 1.4; }
    .scratch-item-time { font-size: 0.7rem; color: #64748b; margin-bottom: 8px; }
    .scratch-item-actions { display: flex; gap: 6px; }
    .scratch-btn {
      padding: 4px 10px; border-radius: 4px; font-size: 0.7rem;
      cursor: pointer; border: 1px solid #334155; background: transparent;
      color: #94a3b8; transition: all 0.15s; font-family: inherit;
    }
    .scratch-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .scratch-btn.activate { border-color: #22c55e; color: #22c55e; }
    .scratch-btn.activate:hover { background: #22c55e; color: white; }
    .scratch-btn.delete { border-color: #ef4444; color: #ef4444; }
    .scratch-btn.delete:hover { background: #ef4444; color: white; }
    
    .scratchpad-empty { text-align: center; padding: 40px 20px; color: #64748b; }
    .scratchpad-empty-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }
    
    /* Right Panel */
    .right-panel { display: flex; flex-direction: column; overflow: hidden; }
    
    /* Add Task Bar */
    .add-task-bar {
      display: flex; gap: 10px; padding: 16px 20px;
      background: #1e293b; border-bottom: 1px solid #334155;
    }
    .add-task-input {
      flex: 1; padding: 10px 14px; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px;
      font-size: 0.9rem; color: #e2e8f0; font-family: inherit;
    }
    .add-task-input:focus { outline: none; border-color: #3b82f6; }
    .add-task-input::placeholder { color: #64748b; }
    .add-task-select {
      padding: 10px 12px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; font-size: 0.85rem; color: #94a3b8;
      font-family: inherit; cursor: pointer;
    }
    .add-task-btn {
      padding: 10px 20px; background: #3b82f6; border: none;
      border-radius: 8px; color: white; font-size: 0.9rem;
      font-weight: 500; cursor: pointer; font-family: inherit;
    }
    .add-task-btn:hover { background: #2563eb; }
    
    /* Task List Area */
    .task-area { flex: 1; overflow-y: auto; padding: 20px; }
    
    /* Section */
    .section { margin-bottom: 24px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; margin-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .section-icon { font-size: 1rem; }
    .section-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
    .section-count { font-size: 0.7rem; color: #64748b; background: #334155; padding: 2px 8px; border-radius: 8px; }
    .section-header.attention .section-title { color: #ef4444; }
    .section-header.active .section-title { color: #22c55e; }
    
    /* Task Row */
    .task-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; margin-bottom: 4px;
      background: #1e293b; border-radius: 8px;
      transition: all 0.15s;
    }
    .task-row:hover { background: #283548; }
    
    .task-checkbox {
      width: 20px; height: 20px; border: 2px solid #475569;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .task-checkbox:hover { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .task-checkbox.completing { background: #22c55e; border-color: #22c55e; }
    .task-checkbox.completing::after { content: '✓'; color: white; font-size: 0.65rem; font-weight: 700; }
    
    .task-content { flex: 1; min-width: 0; }
    .task-text { font-size: 0.9rem; color: #e2e8f0; }
    .task-meta { display: flex; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
    .task-tag {
      font-size: 0.65rem; padding: 2px 6px; border-radius: 3px;
      background: #334155; color: #94a3b8;
    }
    .task-tag.overdue { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .task-tag.due-soon { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .task-tag.due { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .task-tag.handoff { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .task-tag.category { background: #334155; color: #64748b; }
    
    .task-actions { display: flex; gap: 6px; }
    .action-btn {
      padding: 4px 10px; border-radius: 4px; font-size: 0.7rem;
      cursor: pointer; border: 1px solid transparent; background: transparent;
      color: #64748b; transition: all 0.15s; font-family: inherit;
    }
    .action-btn:hover { color: #e2e8f0; }
    .action-btn.activate { border-color: #3b82f6; color: #3b82f6; }
    .action-btn.activate:hover { background: #3b82f6; color: white; }
    .action-btn.deactivate { border-color: #64748b; color: #64748b; }
    .action-btn.deactivate:hover { background: #64748b; color: white; }
    .action-btn.claim { border-color: #a855f7; color: #a855f7; }
    .action-btn.claim:hover { background: #a855f7; color: white; }
    
    /* Category Group */
    .category-group { margin-bottom: 16px; }
    .category-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; cursor: pointer; user-select: none;
    }
    .category-toggle { color: #64748b; font-size: 0.8rem; transition: transform 0.2s; }
    .category-toggle.collapsed { transform: rotate(-90deg); }
    .category-name { font-size: 0.8rem; font-weight: 500; color: #94a3b8; }
    .category-count { font-size: 0.7rem; color: #64748b; }
    .category-tasks { padding-left: 8px; }
    .category-tasks.collapsed { display: none; }
    
    /* Empty State */
    .empty-state { text-align: center; padding: 30px; color: #64748b; font-size: 0.9rem; }
    
    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #22c55e; color: white; padding: 12px 24px;
      border-radius: 8px; font-weight: 500; z-index: 2000;
      opacity: 0; transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #ef4444; }
    
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 30px; color: #64748b; }
    .spinner { width: 20px; height: 20px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Responsive */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 280px 1fr; }
    }
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .left-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">📋</div>
    <div class="login-title">Planning</div>
    <div class="login-box">
      <label class="login-label">Enter your PIN</label>
      <div class="pin-container">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
      </div>
      <div class="login-error" id="loginError">Invalid PIN</div>
    </div>
  </div>

  <div class="main-app" id="mainApp">
    <!-- Shared Nav Bar -->
    <nav class="nav-bar">
      <div class="nav-brand">
        <span class="nav-logo">📋</span>
        <span class="nav-title">Planning</span>
      </div>
      <div class="nav-links">
        <a class="nav-link claude" href="https://claude.ai" target="_blank">🤖 Claude</a>
        <a class="nav-link helm" href="index.html">🚀 Helm</a>
        <a class="nav-link projects" href="projects.html">📊 Projects</a>
        <a class="nav-link doing" href="doing.html">🎯 Doing</a>
        <a class="nav-link courier" href="/emailbot/">📧 Courier</a>
        <button class="nav-link messages" id="msgBtn" onclick="showMessages()" style="display:none;">💬<span class="nav-badge" id="msgBadge">0</span></button>
        <button class="nav-toggle" id="notifToggle" onclick="toggleNotifications()">🔔 <span id="notifStatus">On</span></button>
        <button class="nav-icon-btn" onclick="loadData()">↻</button>
      </div>
      <button class="nav-hamburger" onclick="toggleMobileMenu()">☰</button>
      <div class="nav-mobile" id="navMobile">
        <a class="nav-link claude" href="https://claude.ai" target="_blank">🤖 Claude</a>
        <a class="nav-link helm" href="index.html">🚀 Helm</a>
        <a class="nav-link projects" href="projects.html">📊 Projects</a>
        <a class="nav-link doing" href="doing.html">🎯 Doing</a>
        <a class="nav-link courier" href="/emailbot/">📧 Courier</a>
        <button class="nav-link messages" id="msgBtnMobile" onclick="showMessages()" style="display:none;">💬 Messages <span class="nav-badge" id="msgBadgeMobile">0</span></button>
        <button class="nav-toggle" onclick="toggleNotifications()">🔔 Notifications <span id="notifStatusMobile">On</span></button>
        <button class="nav-link" onclick="loadData()">↻ Refresh</button>
      </div>
    </nav>

    <div class="layout">
      <!-- Left: Scratchpad -->
      <div class="left-panel">
        <div class="scratchpad-input">
          <textarea class="scratchpad-textarea" id="scratchInput" placeholder="What's on your mind?"></textarea>
          <div class="scratchpad-actions">
            <button class="scratchpad-btn primary" onclick="addScratch(true)">+ Active</button>
            <button class="scratchpad-btn secondary" onclick="addScratch(false)">Dump</button>
          </div>
        </div>
        <div class="scratchpad-header">
          <span>Scratchpad <span class="scratchpad-count" id="scratchCount">0</span></span>
        </div>
        <div class="scratchpad-list" id="scratchList"></div>
      </div>

      <!-- Right: Tasks -->
      <div class="right-panel">
        <div class="add-task-bar">
          <input type="text" class="add-task-input" id="taskInput" placeholder="Add a task...">
          <select class="add-task-select" id="taskCategory"><option value="General">General</option></select>
          <button class="add-task-btn" onclick="addTask()">Add</button>
        </div>
        
        <div class="task-area" id="taskArea">
          <div class="loading"><div class="spinner"></div> Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const USER_CONFIG = {
      '1987': { name: 'Micaiah', api: 'https://productivity-mcp-server.micaiah-tasks.workers.dev/api' },
      '1976': { name: 'Irene', api: 'https://productivity-irene.micaiah-tasks.workers.dev/api' }
    };
    let API_URL = '', API_KEY = '';
    let scratchItems = [], categories = ['General'];
    let incomingTasks = [], activeTasks = [], overdueTasks = [], backlog = {};
    let messages = [];
    let notificationsEnabled = localStorage.getItem('notificationsEnabled') !== 'false';

    // Mobile menu & notifications
    function toggleMobileMenu() {
      document.getElementById('navMobile').classList.toggle('open');
    }

    function toggleNotifications() {
      notificationsEnabled = !notificationsEnabled;
      localStorage.setItem('notificationsEnabled', notificationsEnabled);
      updateNotificationUI();
      showToast(notificationsEnabled ? 'Notifications enabled' : 'Notifications disabled');
    }

    function updateNotificationUI() {
      const status = notificationsEnabled ? 'On' : 'Off';
      document.getElementById('notifStatus').textContent = status;
      document.getElementById('notifStatusMobile').textContent = status;
      const toggle = document.getElementById('notifToggle');
      toggle.classList.toggle('on', notificationsEnabled);
      toggle.classList.toggle('off', !notificationsEnabled);
    }

    // Login
    function checkSession() {
      const s = localStorage.getItem('dashboardSession');
      if (s) {
        const { pin, timestamp } = JSON.parse(s);
        if (Date.now() - timestamp < 7*24*60*60*1000 && USER_CONFIG[pin]) {
          API_KEY = pin; API_URL = USER_CONFIG[pin].api;
          showMainApp();
          return true;
        }
      }
      return false;
    }

    const pinInputs = document.querySelectorAll('.pin-digit');
    pinInputs.forEach((input, i) => {
      input.addEventListener('input', e => {
        if (e.target.value && i < 3) pinInputs[i+1].focus();
        if (i === 3 && e.target.value) attemptLogin();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) pinInputs[i-1].focus();
      });
    });

    function attemptLogin() {
      const pin = Array.from(pinInputs).map(i => i.value).join('');
      if (USER_CONFIG[pin]) {
        API_KEY = pin; API_URL = USER_CONFIG[pin].api;
        localStorage.setItem('dashboardSession', JSON.stringify({ pin, timestamp: Date.now() }));
        showMainApp();
      } else {
        document.getElementById('loginError').classList.add('show');
        pinInputs.forEach(input => { input.classList.add('error'); input.value = ''; });
        pinInputs[0].focus();
        setTimeout(() => {
          document.getElementById('loginError').classList.remove('show');
          pinInputs.forEach(input => input.classList.remove('error'));
        }, 2000);
      }
    }

    function showMainApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.add('visible');
      updateNotificationUI();
      loadData();
    }

    async function api(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY };
      try {
        const r = await fetch(API_URL + endpoint, { ...options, headers });
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) { console.error(e); return null; }
    }

    async function loadData() {
      await Promise.all([loadScratchpad(), loadTasks(), loadMessages()]);
    }

    // Scratchpad
    async function loadScratchpad() {
      const data = await api('/scratchpad');
      scratchItems = data?.items || [];
      renderScratchpad();
    }

    function renderScratchpad() {
      document.getElementById('scratchCount').textContent = scratchItems.length;
      const list = document.getElementById('scratchList');
      
      if (scratchItems.length === 0) {
        list.innerHTML = '<div class="scratchpad-empty"><div class="scratchpad-empty-icon">✨</div><div>Scratchpad clear</div></div>';
        return;
      }

      list.innerHTML = scratchItems.map(item => `
        <div class="scratch-item">
          <div class="scratch-item-text">${esc(item.text)}</div>
          <div class="scratch-item-time">${formatTime(item.created_at)}</div>
          <div class="scratch-item-actions">
            <button class="scratch-btn activate" onclick="processScratch('${item.id}', 'activate')">✓ Active</button>
            <button class="scratch-btn" onclick="processScratch('${item.id}', 'task')">→ Task</button>
            <button class="scratch-btn delete" onclick="processScratch('${item.id}', 'delete')">🗑</button>
          </div>
        </div>
      `).join('');
    }

    async function addScratch(makeActive) {
      const input = document.getElementById('scratchInput');
      const text = input.value.trim();
      if (!text) return;

      if (makeActive) {
        const r = await api('/tasks', { method: 'POST', body: JSON.stringify({ text, category: 'General', priority: 3 }) });
        if (r?.id) {
          await api(`/tasks/${r.id}/activate`, { method: 'POST' });
          showToast('Task activated');
          input.value = '';
          loadTasks();
        }
      } else {
        const r = await api('/scratchpad', { method: 'POST', body: JSON.stringify({ text }) });
        if (r?.success) {
          showToast('Added to scratchpad');
          input.value = '';
          loadScratchpad();
        }
      }
    }

    async function processScratch(id, action) {
      const r = await api(`/scratchpad/${id}/process`, { method: 'POST', body: JSON.stringify({ action }) });
      if (r?.success) {
        showToast(action === 'activate' ? 'Task activated' : action === 'task' ? 'Moved to tasks' : 'Deleted');
        loadScratchpad();
        if (action === 'activate' || action === 'task') loadTasks();
      }
    }

    document.getElementById('scratchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addScratch(false); }
      if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); addScratch(true); }
    });

    // Tasks
    async function loadTasks() {
      const data = await api('/morning');
      if (!data) return;

      incomingTasks = data.incoming || [];
      activeTasks = data.activeTasks || [];
      overdueTasks = data.overdueTasks || [];
      backlog = data.backlogByCategory || {};

      // Update category dropdown
      const cats = Object.keys(backlog);
      categories = ['General', ...cats.filter(c => c !== 'General')];
      categories = [...new Set(categories)];
      const select = document.getElementById('taskCategory');
      select.innerHTML = categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

      renderTasks();
    }

    function renderTasks() {
      const area = document.getElementById('taskArea');
      const today = new Date().toISOString().split('T')[0];
      
      // Build "Needs Attention" - overdue + incoming + due today/tomorrow
      const attention = [];
      
      // Add overdue (not active)
      overdueTasks.forEach(t => {
        if (!t.is_active) attention.push({ ...t, reason: 'overdue' });
      });
      
      // Add incoming
      incomingTasks.forEach(t => {
        attention.push({ ...t, reason: 'incoming' });
      });
      
      // Add due today/tomorrow from backlog
      const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
      for (const cat in backlog) {
        backlog[cat].forEach(t => {
          if (!t.is_active && (t.due_date === today || t.due_date === tomorrow)) {
            if (!attention.find(a => a.id === t.id)) {
              attention.push({ ...t, reason: t.due_date === today ? 'due-today' : 'due-soon' });
            }
          }
        });
      }

      let html = '';

      // Needs Attention Section
      if (attention.length > 0) {
        html += `
          <div class="section">
            <div class="section-header attention">
              <span class="section-icon">⚠️</span>
              <span class="section-title">Needs Attention</span>
              <span class="section-count">${attention.length}</span>
            </div>
            ${attention.map(t => taskRow(t, false, t.reason)).join('')}
          </div>
        `;
      }

      // Active Section
      html += `
        <div class="section">
          <div class="section-header active">
            <span class="section-icon">🎯</span>
            <span class="section-title">Active</span>
            <span class="section-count">${activeTasks.length}</span>
          </div>
          ${activeTasks.length === 0 
            ? '<div class="empty-state">No active tasks. Activate something from below.</div>'
            : activeTasks.map(t => taskRow(t, true)).join('')}
        </div>
      `;

      // Backlog Section
      const backlogCats = Object.keys(backlog).filter(c => backlog[c].length > 0);
      if (backlogCats.length > 0) {
        html += `
          <div class="section">
            <div class="section-header">
              <span class="section-icon">📋</span>
              <span class="section-title">Backlog</span>
            </div>
            ${backlogCats.map(cat => categoryGroup(cat, backlog[cat])).join('')}
          </div>
        `;
      }

      area.innerHTML = html;
    }

    function taskRow(task, isActive, reason = null) {
      const today = new Date().toISOString().split('T')[0];
      let tags = '';
      
      if (reason === 'overdue') tags += '<span class="task-tag overdue">Overdue</span>';
      else if (reason === 'incoming') tags += `<span class="task-tag handoff">from ${esc(task.assigned_by)}</span>`;
      else if (reason === 'due-today') tags += '<span class="task-tag overdue">Due today</span>';
      else if (reason === 'due-soon') tags += '<span class="task-tag due-soon">Due tomorrow</span>';
      else if (task.due_date) {
        if (task.due_date < today) tags += '<span class="task-tag overdue">Overdue</span>';
        else if (task.due_date === today) tags += '<span class="task-tag overdue">Due today</span>';
        else tags += `<span class="task-tag due">${formatDate(task.due_date)}</span>`;
      }
      
      if (task.category && !isActive) tags += `<span class="task-tag category">${esc(task.category)}</span>`;

      let actions = '';
      if (reason === 'incoming') {
        actions = `<button class="action-btn claim" onclick="claimTask('${task.id}')">Claim</button>`;
      } else if (isActive) {
        actions = `<button class="action-btn deactivate" onclick="deactivate('${task.id}')">-</button>`;
      } else {
        actions = `<button class="action-btn activate" onclick="activate('${task.id}')">★</button>`;
      }

      return `
        <div class="task-row">
          <div class="task-checkbox" onclick="complete('${task.id}', this)"></div>
          <div class="task-content">
            <div class="task-text">${esc(task.text)}</div>
            ${tags ? `<div class="task-meta">${tags}</div>` : ''}
          </div>
          <div class="task-actions">${actions}</div>
        </div>
      `;
    }

    function categoryGroup(cat, tasks) {
      const id = 'cat-' + cat.replace(/\s+/g, '-').toLowerCase();
      return `
        <div class="category-group">
          <div class="category-header" onclick="toggleCategory('${id}')">
            <span class="category-toggle" id="${id}-toggle">▼</span>
            <span class="category-name">${esc(cat)}</span>
            <span class="category-count">(${tasks.length})</span>
          </div>
          <div class="category-tasks" id="${id}-tasks">
            ${tasks.map(t => taskRow(t, false)).join('')}
          </div>
        </div>
      `;
    }

    function toggleCategory(id) {
      document.getElementById(id + '-toggle').classList.toggle('collapsed');
      document.getElementById(id + '-tasks').classList.toggle('collapsed');
    }

    // Task Actions
    async function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      const category = document.getElementById('taskCategory').value;
      const r = await api('/tasks', { method: 'POST', body: JSON.stringify({ text, category, priority: 3 }) });
      if (r?.success) {
        showToast('Task added');
        input.value = '';
        loadTasks();
      }
    }

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    async function complete(id, el) {
      el.classList.add('completing');
      const r = await api(`/tasks/${id}/complete`, { method: 'POST' });
      if (r?.success) { showToast('Completed ✓'); setTimeout(loadTasks, 300); }
      else el.classList.remove('completing');
    }

    async function activate(id) {
      await api(`/tasks/${id}/activate`, { method: 'POST' });
      showToast('Activated');
      loadTasks();
    }

    async function deactivate(id) {
      await api(`/tasks/${id}/deactivate`, { method: 'POST' });
      showToast('Removed from active');
      loadTasks();
    }

    async function claimTask(id) {
      await api(`/tasks/${id}/claim`, { method: 'POST' });
      showToast('Task claimed');
      loadTasks();
    }

    // Messages
    async function loadMessages() {
      const data = await api('/messages');
      messages = data?.messages || [];
      const btn = document.getElementById('msgBtn');
      const badge = document.getElementById('msgBadge');
      const btnMobile = document.getElementById('msgBtnMobile');
      const badgeMobile = document.getElementById('msgBadgeMobile');
      if (messages.length > 0) { 
        btn.style.display = 'flex'; 
        badge.textContent = messages.length;
        btnMobile.style.display = 'flex';
        badgeMobile.textContent = messages.length;
      } else {
        btn.style.display = 'none';
        btnMobile.style.display = 'none';
      }
    }

    function showMessages() {
      if (messages.length === 0) return;
      alert(messages.map(m => `${m.from_user}: ${m.content}`).join('\n\n'));
    }

    // Helpers
    function formatTime(ts) {
      const d = new Date(ts), now = new Date();
      const diff = Math.floor((now - d) / 60000);
      if (diff < 1) return 'just now';
      if (diff < 60) return diff + 'm ago';
      if (diff < 1440) return Math.floor(diff/60) + 'h ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Close mobile menu when clicking outside
    document.addEventListener('click', e => {
      const nav = document.getElementById('navMobile');
      const hamburger = document.querySelector('.nav-hamburger');
      if (nav.classList.contains('open') && !nav.contains(e.target) && !hamburger.contains(e.target)) {
        nav.classList.remove('open');
      }
    });

    if (!checkSession()) pinInputs[0].focus();
  </script>
</body>
</html>
