<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Thread | Helm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    .login-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-screen.hidden { display: none; }
    .login-logo { font-size: 3rem; margin-bottom: 20px; }
    .login-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 30px; }
    .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; }
    .login-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; display: block; text-align: center; }
    .pin-container { display: flex; gap: 10px; justify-content: center; }
    .pin-digit { width: 50px; height: 60px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; font-size: 1.5rem; font-weight: 700; color: #e2e8f0; text-align: center; }
    .pin-digit:focus { outline: none; border-color: #3b82f6; }
    .pin-digit.error { border-color: #ef4444; animation: shake 0.3s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .login-error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; opacity: 0; }
    .login-error.show { opacity: 1; }
    
    .main-app { display: none; min-height: 100vh; flex-direction: column; }
    .main-app.visible { display: flex; }
    
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { display: flex; align-items: center; gap: 8px; }
    .nav-logo { font-size: 1.2rem; }
    .nav-title { font-size: 0.95rem; font-weight: 600; }
    .nav-links { display: flex; align-items: center; gap: 6px; }
    .nav-link {
      padding: 6px 10px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; font-size: 0.75rem;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px;
      transition: all 0.2s; font-family: inherit;
    }
    .nav-link:hover { border-color: #64748b; color: #e2e8f0; }
    .nav-link.active { background: #334155; color: #e2e8f0; border-color: #475569; }
    .nav-link.helm { border-color: #f97316; color: #f97316; }
    .nav-link.helm:hover { background: #f97316; color: white; }
    .nav-icon-btn {
      padding: 6px 8px; background: transparent; border: 1px solid #334155;
      border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 0.9rem;
    }
    .nav-icon-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .nav-hamburger { display: none; padding: 8px; background: transparent; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 1.2rem; }
    .nav-mobile { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border-bottom: 1px solid #334155; padding: 12px; z-index: 100; flex-direction: column; gap: 8px; }
    .nav-mobile.open { display: flex; }
    @media (max-width: 768px) { .nav-links { display: none; } .nav-hamburger { display: flex; } }
    
    .content { flex: 1; max-width: 800px; margin: 0 auto; padding: 24px 16px; width: 100%; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .page-subtitle { font-size: 0.85rem; color: #64748b; }
    
    .filters { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 0.75rem;
      cursor: pointer; border: 1px solid #334155; background: transparent;
      color: #94a3b8; transition: all 0.15s; font-family: inherit;
    }
    .filter-btn:hover { border-color: #64748b; color: #e2e8f0; }
    .filter-btn.active { background: #06b6d4; border-color: #06b6d4; color: white; }
    .filter-btn.irene.active { background: #f472b6; border-color: #f472b6; }
    
    .thread-list { display: flex; flex-direction: column; gap: 16px; }
    
    .checkin-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; transition: all 0.15s; }
    .checkin-card:hover { border-color: #475569; }
    .checkin-card.expanded { border-color: #06b6d4; }
    .checkin-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; cursor: pointer; }
    .checkin-card-meta { display: flex; flex-direction: column; gap: 4px; }
    .checkin-card-user { font-size: 0.85rem; font-weight: 600; color: #06b6d4; }
    .checkin-card-user.irene { color: #f472b6; }
    .checkin-card-time { font-size: 0.7rem; color: #64748b; }
    .checkin-card-project { font-size: 0.65rem; color: #64748b; background: #334155; padding: 2px 8px; border-radius: 4px; display: inline-block; }
    .checkin-card-expand { background: none; border: none; color: #64748b; cursor: pointer; font-size: 0.8rem; transition: transform 0.2s; }
    .checkin-card-expand.expanded { transform: rotate(180deg); }
    .checkin-card-summary { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; }
    .checkin-card-body { display: none; border-top: 1px solid #334155; padding-top: 16px; margin-top: 12px; }
    .checkin-card-body.visible { display: block; }
    .checkin-card-recap { font-size: 0.85rem; color: #94a3b8; line-height: 1.6; white-space: pre-wrap; }
    
    .comments-section { margin-top: 16px; border-top: 1px solid #334155; padding-top: 16px; }
    .comments-title { font-size: 0.75rem; color: #64748b; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .comment { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .comment-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .comment-user { font-size: 0.75rem; font-weight: 600; color: #06b6d4; }
    .comment-user.irene { color: #f472b6; }
    .comment-time { font-size: 0.65rem; color: #64748b; }
    .comment-content { font-size: 0.85rem; color: #cbd5e1; }
    .comment-input-container { display: flex; gap: 8px; margin-top: 12px; }
    .comment-input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; color: #e2e8f0; font-family: inherit; font-size: 0.85rem; resize: none; min-height: 40px; }
    .comment-input:focus { outline: none; border-color: #06b6d4; }
    .comment-input::placeholder { color: #64748b; }
    .comment-submit { padding: 8px 16px; background: #06b6d4; border: none; border-radius: 8px; color: white; font-size: 0.8rem; cursor: pointer; font-family: inherit; align-self: flex-end; }
    .comment-submit:hover { background: #0891b2; }
    
    .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    .empty-title { font-size: 1.1rem; color: #94a3b8; margin-bottom: 8px; }
    .empty-subtitle { font-size: 0.85rem; }
    
    .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: #64748b; }
    .spinner { width: 24px; height: 24px; border: 2px solid #334155; border-top-color: #06b6d4; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 500; z-index: 2000; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">📜</div>
    <div class="login-title">Activity Thread</div>
    <div class="login-box">
      <label class="login-label">Enter your PIN</label>
      <div class="pin-container">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
        <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
      </div>
      <div class="login-error" id="loginError">Invalid PIN</div>
    </div>
  </div>

  <div class="main-app" id="mainApp">
    <nav class="nav-bar">
      <div class="nav-brand">
        <span class="nav-logo">📜</span>
        <span class="nav-title">Activity Thread</span>
      </div>
      <div class="nav-links">
        <a class="nav-link helm" href="index.html">🚀 Helm</a>
        <button class="nav-icon-btn" onclick="loadCheckins()">↻</button>
      </div>
      <button class="nav-hamburger" onclick="toggleMobileMenu()">☰</button>
      <div class="nav-mobile" id="navMobile">
        <a class="nav-link helm" href="index.html">🚀 Helm</a>
        <button class="nav-link" onclick="loadCheckins()">↻ Refresh</button>
      </div>
    </nav>

    <div class="content">
      <div class="page-header">
        <h1 class="page-title">📜 Activity Thread</h1>
        <p class="page-subtitle">Session recaps and work history</p>
      </div>

      <div class="filters">
        <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
        <button class="filter-btn" id="filterMicaiah" onclick="setFilter('micaiah')">Micaiah</button>
        <button class="filter-btn irene" id="filterIrene" onclick="setFilter('irene')">Irene</button>
      </div>

      <div class="thread-list" id="threadList">
        <div class="loading"><div class="spinner"></div> Loading...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const USER_CONFIG = {
      '1987': { name: 'Micaiah', api: 'https://productivity-mcp-server.micaiah-tasks.workers.dev/api' },
      '1976': { name: 'Irene', api: 'https://productivity-irene.micaiah-tasks.workers.dev/api' }
    };
    let API_URL = '', API_KEY = '', currentUser = '';
    let checkins = [], filter = 'all', expandedIds = new Set();

    function toggleMobileMenu() { document.getElementById('navMobile').classList.toggle('open'); }

    function checkSession() {
      const s = localStorage.getItem('dashboardSession');
      if (s) {
        const { pin, timestamp } = JSON.parse(s);
        if (Date.now() - timestamp < 7*24*60*60*1000 && USER_CONFIG[pin]) {
          API_KEY = pin; API_URL = USER_CONFIG[pin].api;
          currentUser = USER_CONFIG[pin].name.toLowerCase();
          showMainApp();
          return true;
        }
      }
      return false;
    }

    const pinInputs = document.querySelectorAll('.pin-digit');
    pinInputs.forEach((input, i) => {
      input.addEventListener('input', e => {
        if (e.target.value && i < 3) pinInputs[i+1].focus();
        if (i === 3 && e.target.value) attemptLogin();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) pinInputs[i-1].focus();
      });
    });

    function attemptLogin() {
      const pin = Array.from(pinInputs).map(i => i.value).join('');
      if (USER_CONFIG[pin]) {
        API_KEY = pin; API_URL = USER_CONFIG[pin].api;
        currentUser = USER_CONFIG[pin].name.toLowerCase();
        localStorage.setItem('dashboardSession', JSON.stringify({ pin, timestamp: Date.now() }));
        showMainApp();
      } else {
        document.getElementById('loginError').classList.add('show');
        pinInputs.forEach(input => { input.classList.add('error'); input.value = ''; });
        pinInputs[0].focus();
        setTimeout(() => {
          document.getElementById('loginError').classList.remove('show');
          pinInputs.forEach(input => input.classList.remove('error'));
        }, 2000);
      }
    }

    function showMainApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.add('visible');
      loadCheckins();
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) setTimeout(() => toggleExpand(id), 600);
    }

    async function api(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY };
      try {
        const r = await fetch(API_URL + endpoint, { ...options, headers });
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) { console.error(e); return null; }
    }

    async function loadCheckins() {
      document.getElementById('threadList').innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';
      const userParam = filter !== 'all' ? `&user=${filter}` : '';
      const data = await api(`/checkins?limit=50${userParam}`);
      checkins = data?.checkins || [];
      renderCheckins();
    }

    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('filter' + f.charAt(0).toUpperCase() + f.slice(1)).classList.add('active');
      loadCheckins();
    }

    function renderCheckins() {
      const list = document.getElementById('threadList');
      if (checkins.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon">📜</div><div class="empty-title">No check-ins yet</div><div class="empty-subtitle">Say "recap" in Claude to log a session</div></div>';
        return;
      }
      list.innerHTML = checkins.map(c => {
        const isExpanded = expandedIds.has(c.id);
        return `
          <div class="checkin-card ${isExpanded ? 'expanded' : ''}" id="card-${c.id}">
            <div class="checkin-card-header" onclick="toggleExpand('${c.id}')">
              <div class="checkin-card-meta">
                <span class="checkin-card-user ${c.user_id === 'irene' ? 'irene' : ''}">${esc(c.user_id)}</span>
                <span class="checkin-card-time">${formatTime(c.created_at)}</span>
                ${c.project_name ? `<span class="checkin-card-project">${esc(c.project_name)}</span>` : ''}
              </div>
              <button class="checkin-card-expand ${isExpanded ? 'expanded' : ''}">▼</button>
            </div>
            <div class="checkin-card-summary">${esc(c.thread_summary)}</div>
            <div class="checkin-card-body ${isExpanded ? 'visible' : ''}" id="body-${c.id}">
              <div class="checkin-card-recap" id="recap-${c.id}">Loading...</div>
              <div class="comments-section" id="comments-${c.id}"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleExpand(id) {
      const card = document.getElementById('card-' + id);
      const body = document.getElementById('body-' + id);
      const btn = card.querySelector('.checkin-card-expand');
      
      if (expandedIds.has(id)) {
        expandedIds.delete(id);
        card.classList.remove('expanded');
        body.classList.remove('visible');
        btn.classList.remove('expanded');
      } else {
        expandedIds.add(id);
        card.classList.add('expanded');
        body.classList.add('visible');
        btn.classList.add('expanded');
        
        // Load full details
        const data = await api('/checkins/' + id);
        if (data?.checkin) {
          document.getElementById('recap-' + id).innerHTML = formatMarkdown(data.checkin.full_recap || 'No detailed recap available.');
          renderComments(id, data.comments || []);
        }
        
        // Scroll into view
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function renderComments(checkinId, comments) {
      const container = document.getElementById('comments-' + checkinId);
      container.innerHTML = `
        <div class="comments-title">Comments</div>
        ${comments.length > 0 ? comments.map(c => `
          <div class="comment">
            <div class="comment-header">
              <span class="comment-user ${c.user_id === 'irene' ? 'irene' : ''}">${esc(c.user_id)}</span>
              <span class="comment-time">${formatTime(c.created_at)}</span>
            </div>
            <div class="comment-content">${esc(c.content)}</div>
          </div>
        `).join('') : '<div style="color:#64748b;font-size:0.8rem;margin-bottom:12px;">No comments yet</div>'}
        <div class="comment-input-container">
          <textarea class="comment-input" id="commentInput-${checkinId}" placeholder="Add a comment..."></textarea>
          <button class="comment-submit" onclick="addComment('${checkinId}')">Post</button>
        </div>
      `;
    }

    async function addComment(checkinId) {
      const input = document.getElementById('commentInput-' + checkinId);
      const content = input.value.trim();
      if (!content) return;
      
      const r = await api('/checkins/' + checkinId + '/comments', {
        method: 'POST',
        body: JSON.stringify({ content })
      });
      
      if (r?.success) {
        showToast('Comment added');
        input.value = '';
        // Reload comments
        const data = await api('/checkins/' + checkinId);
        if (data?.comments) renderComments(checkinId, data.comments);
      }
    }

    function formatMarkdown(text) {
      if (!text) return '';
      return esc(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^### (.+)$/gm, '<h4 style="color:#e2e8f0;margin:12px 0 6px;">$1</h4>')
        .replace(/^## (.+)$/gm, '<h3 style="color:#e2e8f0;margin:16px 0 8px;">$1</h3>')
        .replace(/^- (.+)$/gm, '• $1<br>')
        .replace(/\n/g, '<br>');
    }

    function formatTime(ts) {
      const d = new Date(ts), now = new Date(), diff = Math.floor((now - d) / 60000);
      if (diff < 1) return 'just now';
      if (diff < 60) return diff + 'm ago';
      if (diff < 1440) return Math.floor(diff/60) + 'h ago';
      if (diff < 10080) return Math.floor(diff/1440) + 'd ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.addEventListener('click', e => {
      const nav = document.getElementById('navMobile');
      const hamburger = document.querySelector('.nav-hamburger');
      if (nav.classList.contains('open') && !nav.contains(e.target) && !hamburger.contains(e.target)) {
        nav.classList.remove('open');
      }
    });

    if (!checkSession()) pinInputs[0].focus();
  </script>
</body>
</html>
